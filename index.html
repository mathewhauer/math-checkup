      sol: `\u201cThe product of ${a} and ${X}\u201d is ${a}${X}; then add ${b}: ${a}${X} + ${b}.`,
      steps: [`\u201cProduct\u201d means multiply, so \u201cthe product of ${a} and ${X}\u201d is ${a} ${TIMES} ${X}, written ${a}${X}.`, `\u201cPlus ${b}\u201d comes after: ${a}${X} + ${b}.`, `No parentheses, because only ${X} is multiplied by ${a}.`] });
  }
  if (t === 3) {
    a = R.int(2, 9);
    return makeItem({ prompt: `Which expression means \u201cthe quotient of a number ${X} and ${a}\u201d?`, correct: S(`${X} ${DIVIDE} ${a}`),
      ds: [SM(`${a} ${DIVIDE} ${X}`, 'expr_order'), SM(`${a}${X}`, 'expr_quotient_product'), SM(`${X} ${MINUS} ${a}`, 'wrong_operation')],
      sol: `\u201cQuotient\u201d means divide, in the order given: ${X} ${DIVIDE} ${a}.`,
      steps: [`\u201cQuotient\u201d means the answer to a division.`, `Keep the order of the words: first ${X}, then ${a}.`, `${X} ${DIVIDE} ${a}.`] });
  }
  if (t === 4) {
    do { a = R.int(2, 9); b = R.int(2, 9); } while (a === b);
    return makeItem({ prompt: `Which expression means \u201c${a} times the sum of a number ${X} and ${b}\u201d?`, correct: S(`${a}(${X} + ${b})`),
      ds: [SM(`${a}${X} + ${b}`, 'expr_grouping'), SM(`${a} + ${X} + ${b}`, 'expr_product_sum'), SM(`${a} + ${b}${X}`, 'expr_swap')],
      sol: `The sum (${X} + ${b}) is found first, so it goes in parentheses: ${a}(${X} + ${b}).`,
      steps: [`\u201cThe sum of ${X} and ${b}\u201d is ${X} + ${b}.`, `\u201c${a} times the sum\u201d means the whole sum is multiplied, so it needs parentheses: ${a}(${X} + ${b}).`, `(${a}${X} + ${b} would multiply only the ${X}.)`] });
  }
  if (t === 5) {
    const T = V('t'); do { a = R.int(6, 15); b = R.int(2, 8); } while (a === b);
    return makeItem({ prompt: `Movie tickets cost $${a} each. There is also a $${b} fee for the whole order. Which expression shows the total cost, in dollars, of ${T} tickets?`, correct: S(`${a}${T} + ${b}`),
      ds: [SM(`${b}${T} + ${a}`, 'expr_swap'), SM(`${a}(${T} + ${b})`, 'expr_grouping'), SM(`${a + b}${T}`, 'like_terms_unlike')],
      sol: `Each ticket costs $${a}, so ${T} tickets cost ${a}${T}. The $${b} fee is added once: ${a}${T} + ${b}.`,
      steps: [`Each ticket costs $${a}, so ${T} tickets cost ${a} ${TIMES} ${T} = ${a}${T} dollars.`, `The fee is paid once for the whole order, so add it at the end: + ${b}.`, `Total: ${a}${T} + ${b}.`] });
  }
  const s = V('s'); a = R.int(3, 9); b = R.int(2, 4); const nm = R.pick(NAMES);
  return makeItem({ prompt: `${nm} has ${s} stickers, gives ${a} to a sister, then shares the rest equally among ${b} friends. Which expression shows how many stickers each friend gets?`, correct: S(`(${s} ${MINUS} ${a}) ${DIVIDE} ${b}`),
    ds: [SM(`${s} ${MINUS} ${a} ${DIVIDE} ${b}`, 'expr_grouping'), SM(`(${a} ${MINUS} ${s}) ${DIVIDE} ${b}`, 'expr_order'), SM(`${b}(${s} ${MINUS} ${a})`, 'expr_quotient_product')],
    sol: `First take away ${a}: (${s} ${MINUS} ${a}). Then divide by ${b}: (${s} ${MINUS} ${a}) ${DIVIDE} ${b}.`,
      steps: [`Start with ${s} stickers and give away ${a}: ${s} ${MINUS} ${a}.`, `The rest is shared among ${b} friends, so divide all of it by ${b}.`, `Use parentheses so the subtraction happens first: (${s} ${MINUS} ${a}) ${DIVIDE} ${b}.`] });
};

G.evalexpr = () => {
  const t = R.int(1, 4);
  if (t === 1) {
    const a = R.int(2, 9), b = R.int(1, 15), x = R.int(2, 9), X = V(R.pick(['x', 'n', 'm'])), ans = a * x + b;
    return makeItem({ prompt: `What is the value of ${a}${X} + ${b} when ${X} = ${x}?`, correct: On(ans),
      ds: [On(Number(`${a}${x}`) + b, 'expr_concat'), On(a * (x + b), 'oop_add_first'), On(a + x + b, 'expr_coef_add')], fill: nearFill(ans, [1, -1, 2]),
      sol: `${a}${X} means ${a} ${TIMES} ${X}: ${a} ${TIMES} ${x} + ${b} = ${a * x} + ${b} = ${ans}.`,
      steps: [`${a}${X} means ${a} ${TIMES} ${X}. Put ${x} in place of ${X}: ${a} ${TIMES} ${x} + ${b}.`, `Multiply first: ${a} ${TIMES} ${x} = ${a * x}.`, `Then add: ${a * x} + ${b} = ${ans}.`] });
  }
  if (t === 2) {
    const c = R.int(2, 5), a = R.int(2, 6), X = V(R.pick(['a', 'x', 'y'])), ans = c * a * a;
    return makeItem({ prompt: `What is the value of ${c}${X}<sup>2</sup> when ${X} = ${a}?`, correct: On(ans),
      ds: [On(c * a * c * a, 'exp_coefficient'), On(c * a * 2, 'exp_times'), On(a * a, 'expr_drop_term')], fill: nearFill(ans, [a, -a, c]),
      sol: `Square first: ${a}<sup>2</sup> = ${a * a}. Then ${c} ${TIMES} ${a * a} = ${ans}.`,
      steps: [`Put ${a} in place of ${X}: ${c} ${TIMES} ${a}<sup>2</sup>.`, `Exponent first: ${a}<sup>2</sup> = ${a} ${TIMES} ${a} = ${a * a}.`, `Then multiply: ${c} ${TIMES} ${a * a} = ${ans}. Only the ${X} is squared, not the ${c}.`] });
  }
  if (t === 3) {
    const k = R.int(2, 6), q = R.int(3, 12), b = R.int(2, 9), m = k * q, M = V('m'), ans = q + b;
    return makeItem({ prompt: `What is the value of ${M} ${DIVIDE} ${k} + ${b} when ${M} = ${m}?`, correct: On(ans),
      ds: [m % (k + b) === 0 ? On(m / (k + b), 'oop_add_first') : null, (m + b) % k === 0 ? On((m + b) / k, 'oop_add_first') : null, On(m * k + b, 'wrong_operation'), On(ans + 1)], fill: nearFill(ans, [2, -1, -2]),
      sol: `Divide first: ${m} ${DIVIDE} ${k} = ${q}. Then ${q} + ${b} = ${ans}.`,
      steps: [`Put ${m} in place of ${M}: ${m} ${DIVIDE} ${k} + ${b}.`, `Divide before adding: ${m} ${DIVIDE} ${k} = ${q}.`, `Then add: ${q} + ${b} = ${ans}.`] });
  }
  const a = R.int(2, 6), x = R.int(3, 9), y = R.int(1, x - 1), X = V('x'), Y = V('y'), ans = a * x - y;
  return makeItem({ prompt: `What is the value of ${a}${X} ${MINUS} ${Y} when ${X} = ${x} and ${Y} = ${y}?`, correct: On(ans),
    ds: [On(a * (x - y), 'oop_add_first'), On(Number(`${a}${x}`) - y, 'expr_concat'), On(a + x - y, 'expr_coef_add')], fill: nearFill(ans, [1, -1, 2]),
    sol: `${a} ${TIMES} ${x} = ${a * x}, then ${a * x} ${MINUS} ${y} = ${ans}.`,
      steps: [`Put in the numbers: ${a} ${TIMES} ${x} ${MINUS} ${y}.`, `Multiply first: ${a} ${TIMES} ${x} = ${a * x}.`, `Then subtract: ${a * x} ${MINUS} ${y} = ${ans}.`] });
};

G.equivexpr = () => {
  const X = V(R.pick(['x', 'n', 'y', 'a'])), t = R.int(1, 4);
  if (t === 1) {
    const a = R.int(2, 9), b = R.int(2, 9);
    return makeItem({ prompt: `Which expression is equivalent to ${a}(${X} + ${b})?`, correct: S(`${a}${X} + ${a * b}`),
      ds: [SM(`${a}${X} + ${b}`, 'distrib_partial'), SM(`${X} + ${a * b}`, 'distrib_partial'), SM(`${a * b}${X}`, 'like_terms_unlike')],
      sol: `Multiply ${a} by both terms: ${a} ${TIMES} ${X} + ${a} ${TIMES} ${b} = ${a}${X} + ${a * b}.`,
      steps: [`The ${a} outside the parentheses multiplies everything inside.`, `${a} ${TIMES} ${X} = ${a}${X}.`, `${a} ${TIMES} ${b} = ${a * b}.`, `So ${a}(${X} + ${b}) = ${a}${X} + ${a * b}.`] });
  }
  if (t === 2) {
    let a, b; do { a = R.int(2, 8); b = R.int(2, 8); } while (a === 2 && b === 2);
    const c = R.int(1, 9);
    return makeItem({ prompt: `Which expression is equivalent to ${a}${X} + ${b}${X} + ${c}?`, correct: S(`${a + b}${X} + ${c}`),
      ds: [SM(`${a + b + c}${X}`, 'like_terms_unlike'), SM(`${a * b}${X} + ${c}`, 'like_terms_multiply'), SM(`${a + b}${X}<sup>2</sup> + ${c}`, 'like_terms_power')],
      sol: `${a}${X} and ${b}${X} are like terms: ${a}${X} + ${b}${X} = ${a + b}${X}. The ${c} has no ${X}, so it stays separate.`,
      steps: [`Like terms have the same letter part: ${a}${X} and ${b}${X} are like terms, but ${c} is not.`, `Add the like terms by adding the numbers in front: ${a} + ${b} = ${a + b}, so ${a}${X} + ${b}${X} = ${a + b}${X}.`, `The ${c} stays as it is: ${a + b}${X} + ${c}.`] });
  }
  if (t === 3) {
    const g = R.int(2, 6); let b, c; do { b = R.int(2, 7); c = R.int(2, 7); } while (gcd(b, c) !== 1 || b === c);
    return makeItem({ prompt: `Which expression is equivalent to ${g * b} + ${g * c}${X}?`, correct: S(`${g}(${b} + ${c}${X})`),
      ds: [SM(`${g}(${b} + ${g * c}${X})`, 'factor_partial'), SM(`${g * b + g * c}${X}`, 'like_terms_unlike'), S(`${g}(${b} + ${c + 1}${X})`)],
      sol: `${g} is a factor of both terms: ${g * b} = ${g} ${TIMES} ${b} and ${g * c}${X} = ${g} ${TIMES} ${c}${X}, so ${g}(${b} + ${c}${X}).`,
      steps: [`Find the biggest number that divides both ${g * b} and ${g * c}: it is ${g}.`, `${g * b} = ${g} ${TIMES} ${b} and ${g * c}${X} = ${g} ${TIMES} ${c}${X}.`, `Take the ${g} out front: ${g}(${b} + ${c}${X}).`, `Check by multiplying back: ${g} ${TIMES} ${b} = ${g * b} and ${g} ${TIMES} ${c}${X} = ${g * c}${X}.`] });
  }
  const a = R.int(2, 9), b = R.int(2, 9);
  return makeItem({ prompt: `Which expression is equivalent to ${a}(${X} ${MINUS} ${b})?`, correct: S(`${a}${X} ${MINUS} ${a * b}`),
    ds: [SM(`${a}${X} ${MINUS} ${b}`, 'distrib_partial'), SM(`${a}${X} + ${a * b}`, 'distrib_sign'), SM(`${X} ${MINUS} ${a * b}`, 'distrib_partial')],
    sol: `Multiply ${a} by both terms and keep the minus: ${a}${X} ${MINUS} ${a * b}.`,
      steps: [`The ${a} multiplies both terms inside, and the minus sign stays.`, `${a} ${TIMES} ${X} = ${a}${X}.`, `${a} ${TIMES} ${b} = ${a * b}, still subtracted.`, `So ${a}(${X} ${MINUS} ${b}) = ${a}${X} ${MINUS} ${a * b}.`] });
};

G.onestep = () => {
  const X = V(R.pick(['x', 'n', 'y', 'm'])), A = (v, m) => O(`${X} = ${num(v)}`, kn(v), m), t = R.int(1, 5);
  const near = c => () => { const v = round6(c + R.pick([1, -1, 2, 10, -10])); return v > 0 ? A(v) : null; };
  if (t === 1) {
    const a = R.int(5, 40), x = R.int(3, 60), b = a + x;
    return makeItem({ prompt: `Solve: ${X} + ${a} = ${b}`, correct: A(x), ds: [A(b + a, 'eq_wrong_inverse'), A(x + 10), A(x - 1)], fill: near(x),
      sol: `Subtract ${a} from both sides: ${X} = ${b} ${MINUS} ${a} = ${x}.`,
      steps: [`${a} is added to ${X}. To undo adding, subtract ${a} from both sides.`, `${X} = ${b} ${MINUS} ${a} = ${x}.`, `Check: ${x} + ${a} = ${b}.`] });
  }
  if (t === 2) {
    const a = R.int(5, 30), b = R.int(3, 50), x = a + b;
    return makeItem({ prompt: `Solve: ${X} ${MINUS} ${a} = ${b}`, correct: A(x), ds: [b - a > 0 ? A(b - a, 'eq_wrong_inverse') : null, A(x + 10), A(x - 1)], fill: near(x),
      sol: `Add ${a} to both sides: ${X} = ${b} + ${a} = ${x}.`,
      steps: [`${a} is subtracted from ${X}. To undo subtracting, add ${a} to both sides.`, `${X} = ${b} + ${a} = ${x}.`, `Check: ${x} ${MINUS} ${a} = ${b}.`] });
  }
  if (t === 3) {
    const a = R.int(3, 12), x = R.int(3, 15), b = a * x;
    return makeItem({ prompt: `Solve: ${a}${X} = ${b}`, correct: A(x), ds: [A(a * b, 'eq_wrong_inverse'), A(b - a, 'eq_wrong_operation'), A(x + 1)], fill: near(x),
      sol: `Divide both sides by ${a}: ${X} = ${b} ${DIVIDE} ${a} = ${x}.`,
      steps: [`${a}${X} means ${a} ${TIMES} ${X}. To undo multiplying, divide both sides by ${a}.`, `${X} = ${b} ${DIVIDE} ${a} = ${x}.`, `Check: ${a} ${TIMES} ${x} = ${b}.`] });
  }
  if (t === 4) {
    const a = R.int(2, 9), b = R.int(3, 15), x = a * b;
    return makeItem({ prompt: `Solve: ${fr(X, a)} = ${b}`, correct: A(x), ds: [b % a === 0 ? A(b / a, 'eq_wrong_inverse') : null, A(a + b, 'eq_wrong_operation'), b - a > 0 ? A(b - a, 'eq_wrong_operation') : null, A(x + a)], fill: near(x),
      sol: `Multiply both sides by ${a}: ${X} = ${b} ${TIMES} ${a} = ${x}.`,
      steps: [`${fr(X, a)} means ${X} ${DIVIDE} ${a}. To undo dividing, multiply both sides by ${a}.`, `${X} = ${b} ${TIMES} ${a} = ${x}.`, `Check: ${x} ${DIVIDE} ${a} = ${b}.`] });
  }
  let a, b; do { a = R.int(11, 89) / 10; b = R.int(Math.ceil(a) + 1, 20); } while (isInt(a));
  const x = round6(b - a);
  return makeItem({ prompt: `Solve: ${X} + ${num(a)} = ${b}`, correct: A(x), ds: [A(b + a, 'eq_wrong_inverse'), A(x + 1), A(x - 0.1)], fill: near(x),
    sol: `Subtract ${num(a)} from both sides: ${X} = ${b} ${MINUS} ${num(a)} = ${num(x)}.`,
      steps: [`To undo adding ${num(a)}, subtract ${num(a)} from both sides.`, `${X} = ${b} ${MINUS} ${num(a)}. Write ${b} as ${b}.0 and subtract: ${num(x)}.`, `Check: ${num(x)} + ${num(a)} = ${b}.`] });
};

const ISYM = { gt: '&gt;', ge: '\u2265', lt: '&lt;', le: '\u2264' };
const IOC = { gt: 'ge', ge: 'gt', lt: 'le', le: 'lt' }, IDIR = { gt: 'lt', ge: 'le', lt: 'gt', le: 'ge' }, IBOTH = { gt: 'le', ge: 'lt', lt: 'ge', le: 'gt' };
G.inequal = () => {
  const t = R.int(1, 3);
  if (t === 1) {
    const b = R.int(-3, 8), s = R.pick(['gt', 'ge', 'lt', 'le']), X = V('x'), mk = (ss, m) => O(`${X} ${ISYM[ss]} ${num(b)}`, ss, m);
    return makeItem({ prompt: 'Which inequality matches the graph?', fig: svgIneq(b, s), correct: mk(s),
      ds: [mk(IOC[s], 'ineq_open_closed'), mk(IDIR[s], 'ineq_direction'), mk(IBOTH[s], 'ineq_direction')],
      sol: `${s === 'ge' || s === 'le' ? 'A closed (filled) circle means the number is included' : 'An open circle means the number is not included'}, and the arrow points ${s === 'gt' || s === 'ge' ? 'right (greater)' : 'left (less)'}: ${X} ${ISYM[s]} ${num(b)}.`,
      steps: [s === 'ge' || s === 'le' ? `The circle at ${num(b)} is filled in, so ${num(b)} is included. Use \u2265 or \u2264.` : `The circle at ${num(b)} is open (empty), so ${num(b)} is not included. Use &gt; or &lt;.`, s === 'gt' || s === 'ge' ? `The arrow points right, toward bigger numbers, so ${X} is greater.` : `The arrow points left, toward smaller numbers, so ${X} is less.`, `Put them together: ${X} ${ISYM[s]} ${num(b)}.`] });
  }
  if (t === 2) {
    const c = R.pick([
      { s: 'ge', v: 'h', n: R.int(40, 54), q: (n, v) => `You must be at least ${n} inches tall to go on a ride. Which inequality shows the heights, ${v}, that are allowed?` },
      { s: 'le', v: 'p', n: R.int(8, 16), q: (n, v) => `An elevator can carry at most ${n} people. Which inequality shows the number of people, ${v}, it can carry?` },
      { s: 'gt', v: 'p', n: R.int(100, 300), q: (n, v) => `More than ${n} people came to the school play. Which inequality shows the number of people, ${v}, who came?` },
      { s: 'lt', v: 't', n: R.int(20, 45), q: (n, v) => `The temperature stayed below ${n}\u00b0F all day. Which inequality shows the temperature, ${v}?` },
      { s: 'le', v: 'w', n: R.int(20, 50), q: (n, v) => `A carry-on bag can weigh no more than ${n} pounds. Which inequality shows the weights, ${v}, that are allowed?` },
    ]);
    const mk = (ss, m) => O(`${V(c.v)} ${ISYM[ss]} ${c.n}`, ss, m);
    return makeItem({ prompt: c.q(c.n, V(c.v)), correct: mk(c.s), ds: [mk(IOC[c.s], 'ineq_inclusive'), mk(IDIR[c.s], 'ineq_direction'), mk(IBOTH[c.s], 'ineq_direction')],
      sol: `\u201cAt least\u201d means \u2265, \u201cat most\u201d or \u201cno more than\u201d means \u2264, \u201cmore than\u201d means &gt;, and \u201cbelow\u201d or \u201cless than\u201d means &lt;. The answer is ${V(c.v)} ${ISYM[c.s]} ${c.n}.`,
      steps: [{ ge: `\u201cAt least ${c.n}\u201d means ${c.n} or more, so ${c.n} itself is allowed: \u2265.`, le: `\u201cAt most\u201d or \u201cno more than\u201d ${c.n} means ${c.n} or less, so ${c.n} itself is allowed: \u2264.`, gt: `\u201cMore than ${c.n}\u201d means bigger than ${c.n}, and ${c.n} itself doesn\u2019t count: &gt;.`, lt: `\u201cBelow ${c.n}\u201d means less than ${c.n}, and ${c.n} itself doesn\u2019t count: &lt;.` }[c.s], `Write the letter first: ${V(c.v)} ${ISYM[c.s]} ${c.n}.`] });
  }
  const b = R.int(3, 20), gt = R.chance(0.5), X = V('x');
  return makeItem({ prompt: `Which value of ${X} makes ${X} ${gt ? '&gt;' : '&lt;'} ${b} true?`, correct: On(gt ? b + 1 : b - 1),

    sol: `${X} ${gt ? '&gt;' : '&lt;'} ${b} means ${X} must be ${gt ? 'greater' : 'less'} than ${b} (not equal to it), so ${gt ? b + 1 : b - 1} works.`,
      steps: [`${X} ${gt ? '&gt;' : '&lt;'} ${b} means ${X} is ${gt ? 'greater' : 'less'} than ${b}. ${b} itself does not count.`, `Check each choice: only ${gt ? b + 1 : b - 1} is ${gt ? 'bigger' : 'smaller'} than ${b}.`] });
};

G.tableeq = () => {

// ===== Section F: Negative numbers & the coordinate plane =====

function factorsOf(n) { const f = []; for (let i = 1; i <= n; i++) if (n % i === 0) f.push(i); return f; }

    fill: () => Of(fAdd(Vv, F(R.pick([w, -w, h]), 1)), null, cu),
    sol: `Volume = ${lt} ${TIMES} ${w} ${TIMES} ${h} = ${fH(Vv)} cubic ${u}.`,
      steps: ['Volume = length \u00d7 width \u00d7 height.', `Multiply the whole numbers first: ${w} ${TIMES} ${h} = ${w * h}.`, `Now ${w * h} ${TIMES} ${lt}: ${w * h} ${TIMES} ${k} = ${w * h * k}, and half of ${w * h} is ${w * h / 2}.`, `Add them: ${w * h * k} + ${w * h / 2} = ${fH(Vv)}.`] });
};

G.surfacearea = () => {
  const u = R.pick(['cm', 'in', 'ft', 'm']), su = 'sq ' + u;
  if (R.chance(0.5)) {
    const s = R.pick([2, 3, 5, 7, 8, 9]), SA = 6 * s * s;
    return makeItem({ prompt: `Each edge of a cube is ${s} ${u} long. What is the surface area of the cube?`, fig: svgBox(s, s, s, { l: `${s} ${u}`, w: `${s} ${u}`, h: `${s} ${u}` }), correct: On(SA, null, su),
      ds: [On(s * s * s, 'vol_sa_confuse', su), On(4 * s * s, 'sa_missing_faces', su), On(6 * s, 'sa_forgot_square', su)], fill: nearFill(SA, [s * s, -s * s, 2 * s], su),
      sol: `A cube has 6 square faces, each ${s} ${TIMES} ${s} = ${s * s} sq ${u}. 6 ${TIMES} ${s * s} = ${SA} sq ${u}.`,
      steps: ['A cube has 6 faces, and they are all the same square.', `One face: ${s} ${TIMES} ${s} = ${s * s}.`, `All 6 faces: 6 ${TIMES} ${s * s} = ${SA}. (${s} ${TIMES} ${s} ${TIMES} ${s} = ${s * s * s} would be the volume.)`] });
  }
  let l, w, h; do { l = R.int(3, 10); w = R.int(2, 8); h = R.int(2, 9); } while (l === w || w === h || l === h);
  const SA = 2 * (l * w + l * h + w * h);
  return makeItem({ prompt: 'What is the surface area of the box?', fig: svgBox(l, w, h, { l: `${l} ${u}`, w: `${w} ${u}`, h: `${h} ${u}` }), correct: On(SA, null, su),
    ds: [On(l * w * h, 'vol_sa_confuse', su), On(l * w + l * h + w * h, 'sa_three_faces', su), On(SA - 2 * l * w, 'sa_missing_faces', su)], fill: nearFill(SA, [l, -w, 2 * h], su),
    sol: `Six faces in three matching pairs: 2 ${TIMES} (${l}${TIMES}${w}) + 2 ${TIMES} (${l}${TIMES}${h}) + 2 ${TIMES} (${w}${TIMES}${h}) = ${2 * l * w} + ${2 * l * h} + ${2 * w * h} = ${SA} sq ${u}.`,
      steps: ['A box has 6 faces in 3 matching pairs: top and bottom, front and back, left and right.', `Top and bottom: ${l} ${TIMES} ${w} = ${l * w} each, so ${2 * l * w}.`, `Front and back: ${l} ${TIMES} ${h} = ${l * h} each, so ${2 * l * h}.`, `Left and right: ${w} ${TIMES} ${h} = ${w * h} each, so ${2 * w * h}.`, `Add all six: ${2 * l * w} + ${2 * l * h} + ${2 * w * h} = ${SA}.`] });
};

const CUST = [['feet', 'foot', 'inches', 12], ['yards', 'yard', 'feet', 3], ['gallons', 'gallon', 'quarts', 4], ['pounds', 'pound', 'ounces', 16]];
const METRIC = [['kilometers', 'kilometer', 'meters', 1000], ['meters', 'meter', 'centimeters', 100], ['kilograms', 'kilogram', 'grams', 1000], ['liters', 'liter', 'milliliters', 1000]];
G.convert = () => {
  const t = R.pick(['down', 'up', 'mdown', 'mup', 'time']);
  if (t === 'down') {
    const [big, bs, sm, f] = R.pick(CUST), half = f % 2 === 0 && R.chance(0.4), v = R.int(3, 9) + (half ? 0.5 : 0), vf = F(Math.round(v * 2), 2);
    return makeItem({ prompt: `How many ${sm} are in ${halfTxt(v)} ${big}? (1 ${bs} = ${f} ${sm})`, correct: Of(fMul(vf, F(f, 1)), null, sm),
      ds: [Of(fDiv(vf, F(f, 1)), 'conv_wrong_way', sm), Of(fAdd(vf, F(f, 1)), 'conv_add_sub', sm), Of(fMul(vf, F(10, 1)), 'conv_base_ten', sm)],
      fill: () => Of(fAdd(fMul(vf, F(f, 1)), F(R.pick([f, -f, 2]), 1)), null, sm),
      sol: `Each ${bs} is ${f} ${sm}, so multiply: ${halfTxt(v)} ${TIMES} ${f} = ${num(v * f)} ${sm}.`,
      steps: [`1 ${bs} = ${f} ${sm}. Smaller units means more of them, so multiply.`, half ? `${halfTxt(v)} ${TIMES} ${f}: ${Math.floor(v)} ${TIMES} ${f} = ${Math.floor(v) * f}, and half of ${f} is ${f / 2}. Add: ${Math.floor(v) * f} + ${f / 2} = ${v * f}.` : `${v} ${TIMES} ${f} = ${v * f}.`] });
  }
  if (t === 'up') {
    const [big, bs, sm, f] = R.pick(CUST), q = R.int(2, 9), half = f % 2 === 0 && R.chance(0.5), n = f * q + (half ? f / 2 : 0);
    return makeItem({ prompt: `How many ${big} are in ${n} ${sm}? (1 ${bs} = ${f} ${sm})`, correct: Of(F(n, f), null, big),
      ds: [Of(F(n * f, 1), 'conv_wrong_way', big), Of(F(n - f, 1), 'conv_add_sub', big), O(num(n / 10) + ' ' + big, 'd' + n / 10, 'conv_base_ten')],
      fill: () => Of(fAdd(F(n, f), F(R.pick([1, -1, 2]), 1)), null, big),
      sol: `Every ${f} ${sm} make 1 ${bs}, so divide: ${n} ${DIVIDE} ${f} = ${fH(F(n, f))} ${big}.`,
      steps: [`${f} ${sm} make 1 ${bs}. Bigger units means fewer of them, so divide.`, `${n} ${DIVIDE} ${f} = ${Math.floor(n / f)}${n % f ? ` R ${n % f}` : ''}.`, n % f ? `The ${n % f} left over is ${fr(n % f, f)} = ${fH(F(n % f, f))} of a ${bs}, so the answer is ${fH(F(n, f))}.` : null] });
  }
  if (t === 'mdown') {
    const [big, bs, sm, f] = R.pick(METRIC), v = R.int(2, 9) + R.pick([0, 0.5, 0.25, 0.75]), c = round6(v * f);
    return makeItem({ prompt: `How many ${sm} are in ${num(v)} ${big}? (1 ${bs} = ${num(f)} ${sm})`, correct: On(c, null, sm),
      ds: [On(c / 10, 'conv_metric_places', sm), On(c * 10, 'conv_metric_places', sm), On(v / f, 'conv_wrong_way', sm)], fill: nearFill(c, [f, -f], sm),
      sol: `Multiply by ${num(f)}: ${num(v)} ${TIMES} ${num(f)} = ${num(c)} ${sm}.`,
      steps: [`1 ${bs} = ${num(f)} ${sm}, so multiply by ${num(f)}.`, `Multiplying by ${num(f)} moves the decimal point ${String(f).length - 1} places to the right: ${num(v)} becomes ${num(c)}.`] });
  }
  if (t === 'mup') {
    const [big, bs, sm, f] = R.pick(METRIC), n = R.int(12, 95) * (f / 100) * 10, c = round6(n / f);
    return makeItem({ prompt: `How many ${big} are in ${num(n)} ${sm}? (1 ${bs} = ${num(f)} ${sm})`, correct: On(c, null, big),
      ds: [On(c * 10, 'conv_metric_places', big), On(c / 10, 'conv_metric_places', big), On(n * f, 'conv_wrong_way', big)], fill: nearFill(c, [1, -1, 0.5], big, 0.01),
      sol: `Divide by ${num(f)}: ${num(n)} ${DIVIDE} ${num(f)} = ${num(c)} ${big}.`,
      steps: [`${num(f)} ${sm} make 1 ${bs}, so divide by ${num(f)}.`, `Dividing by ${num(f)} moves the decimal point ${String(f).length - 1} places to the left: ${num(n)} becomes ${num(c)}.`] });
  }
  const m = R.pick([90, 150, 210, 270, 45, 105]), c = m / 60, hr = Math.floor(m / 60), mn = m % 60;
  return makeItem({ prompt: `How many hours is ${m} minutes? (1 hour = 60 minutes)`, correct: On(c, null, 'hours'),
    ds: [O(`${hr}.${mn} hours`, 'td', 'time_decimal'), On(m * 60, 'conv_wrong_way', 'hours'), On(m - 60 > 0 ? m - 60 : m + 60, 'conv_add_sub', 'hours')], fill: nearFill(c, [0.5, 1, -0.25], 'hours', 0.25),
    sol: `${m} ${DIVIDE} 60 = ${num(c)} hours (${hr ? hr + ' hour' + (hr > 1 ? 's' : '') + ' and ' : ''}${mn} minutes, and ${mn} minutes is ${fH(F(mn, 60))} of an hour).`,
      steps: ['60 minutes make 1 hour, so divide by 60.', hr ? `${m} minutes = ${hr} ${nth(hr, 'hour', 'hours')} (${hr * 60} minutes) and ${mn} minutes more.` : null, `${mn} minutes is ${fr(mn, 60)} of an hour, which is ${fH(F(mn, 60))} = ${num(mn / 60)}.`, `So ${m} minutes = ${num(c)} hours. (${hr}.${mn} would be wrong: minutes aren\u2019t tenths and hundredths.)`] });
};

// ===== Section H: Statistics & data =====
const STATQ = [
  ['How many hours of sleep do students in my class usually get on a school night?', 'How many hours did I sleep last night?', 'What time does my school start?', 'How many students are in my class?'],
  ['How tall are the players on our basketball team?', 'How tall is the basketball hoop?', 'How many players are on our team?', 'What color are our team jerseys?'],
  ['How many pets do the families on my street have?', 'How many pets does my family have?', 'What is my dog\u2019s name?', 'How old is my cat?'],
  ['How many minutes do 6th graders spend on homework each night?', 'How many minutes did I spend on homework last night?', 'How long is the school day?', 'What time is lunch?'],
  ['What are the favorite sports of students in our grade?', 'What is my favorite sport?', 'When is the next soccer game?', 'How many sports teams does our school have?'],
  ['How much do the backpacks of students in my class weigh?', 'How much does my backpack weigh?', 'What color is my backpack?', 'How many pockets does my backpack have?'],
  ['How many books did each student in my class read this summer?', 'How many books did I read this summer?', 'How many books are in the school library?', 'Who wrote my favorite book?'],
];
G.statq = () => {
  const s = R.pick(STATQ);
  return makeItem({ prompt: 'Which is a <b>statistical question</b>?', fixed: [{ h: s[0], c: true }, ...s.slice(1).map(h => ({ h, m: 'stat_q_single' }))],
    sol: `\u201c${s[0]}\u201d expects many different answers that vary, so it is statistical. The others each have one answer.`,
      steps: ['A statistical question is one you answer by collecting many answers that vary.', `\u201c${s[0]}\u201d asks about many people or things, so the answers will be different.`, 'Each of the other questions has just one answer.'] });
};

G.dotplot = () => {
  const ctx = R.pick([['Books read last month', 'students', 'read', 'books'], ['Pets at home', 'students', 'have', 'pets'], ['Goals scored per game', 'games', 'had', 'goals']]);
  let counts, tot; do { counts = Array.from({ length: 7 }, () => R.int(0, 5)); tot = counts.reduce((a, b) => a + b, 0); } while (tot < 12 || tot > 22 || counts.filter(c => c > 0).length < 5);
  const fig = svgDots(counts, 0, ctx[0]), t = R.int(1, 3);
  if (t === 1) {
    const k = R.int(2, 4), c = counts.slice(k + 1).reduce((a, b) => a + b, 0), ge = c + counts[k];
    return makeItem({ prompt: `The dot plot shows data for some ${ctx[1]}. How many ${ctx[1]} ${ctx[2]} <b>more than</b> ${k} ${ctx[3]}?`, fig, correct: On(c),
      ds: [On(ge, 'data_boundary'), On(tot - c, 'data_complement'), On(counts[k + 1], null)], fill: nearFill(c, [1, -1, 2], null, 0),
      sol: `Count the dots above ${k + 1} and higher (not ${k} itself): ${counts.slice(k + 1).join(' + ')} = ${c}.`,
      steps: [`Each dot is one ${ctx[1].slice(0, -1)}.`, `\u201cMore than ${k}\u201d means ${k + 1} or more, so don\u2019t count the dots above ${k}.`, `Count the dots above ${k + 1} through 6: ${counts.slice(k + 1).join(' + ')} = ${c}.`] });
  }
  if (t === 2) {
    const mx = Math.max(...counts);
    if (counts.filter(x => x === mx).length > 1) return G.dotplot();
    const mode = counts.indexOf(mx);
    return makeItem({ prompt: `What is the <b>mode</b> of the data in the dot plot?`, fig, correct: On(mode),
      ds: [On(mx, 'mode_count'), On(6 - mode === mode ? (mode + 1) % 7 : 6 - mode), On(3)], fill: () => On(R.int(0, 6)),
      sol: `The mode is the value with the most dots: ${mode} (it has ${mx} dots).`,
      steps: ['The mode is the value that shows up most often: the tallest stack of dots.', `The tallest stack is above ${mode}, with ${mx} dots.`, `So the mode is ${mode}. (${mx} is how many times it shows up, not the mode itself.)`] });
  }
  const sum = counts.reduce((a, c, i) => a + c * i, 0);
  return makeItem({ prompt: `How many ${ctx[1]} are shown in the dot plot?`, fig, correct: On(tot),
    ds: [On(counts.filter(c => c > 0).length, 'data_count_columns'), On(sum, 'data_total_vs_count'), On(tot + 1)], fill: nearFill(tot, [2, -1, -2]),
    sol: `Each dot is one ${ctx[1].slice(0, -1)}. Count all the dots: ${tot}.`,
      steps: [`Each dot stands for one ${ctx[1].slice(0, -1)}, so count every dot, not the columns.`, `Column by column: ${counts.join(' + ')} = ${tot}.`] });
};

G.mean = () => {
  for (;;) {
    const n = R.chance(0.6) ? 5 : 4, vals = Array.from({ length: n - 1 }, () => R.int(2, 20));
    const s = vals.reduce((a, b) => a + b, 0); let last = R.int(2, 20); last += (n - (s + last) % n) % n;
    if (last > 22) continue;
    vals.push(last);
    const S = s + last, mean = S / n, sorted = vals.slice().sort((a, b) => a - b);
    const med = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2, rng = sorted[n - 1] - sorted[0];
    if (new Set([mean, med, rng, S].map(kn)).size < 4) continue;
    return makeItem({ prompt: `What is the <b>mean</b> of these numbers? &nbsp;${vals.join(', \u2009')}`, correct: On(mean),
      ds: [On(med, 'mean_median_confuse'), On(S, 'mean_no_divide'), On(rng, 'center_spread_confuse')], fill: nearFill(mean, [1, -1, 2]),
      sol: `Add them: ${vals.join(' + ')} = ${S}. Divide by how many there are (${n}): ${S} ${DIVIDE} ${n} = ${mean}.`,
      steps: [`Add all the numbers: ${vals.join(' + ')} = ${S}.`, `Count how many numbers there are: ${n}.`, `Divide the total by the count: ${S} ${DIVIDE} ${n} = ${mean}.`] });
  }
};

G.median = () => {
  for (;;) {
    const even = R.chance(0.4), n = even ? 6 : 7;
    const vals = []; while (vals.length < n) { const v = R.int(1, 30); if (!vals.includes(v)) vals.push(v); }
    const sorted = vals.slice().sort((a, b) => a - b);
    const med = even ? (sorted[2] + sorted[3]) / 2 : sorted[3];
    const unsorted = even ? (vals[2] + vals[3]) / 2 : vals[3];
    if (unsorted === med) continue;
    const mean = vals.reduce((a, b) => a + b, 0) / n, mid = (sorted[0] + sorted[n - 1]) / 2;
    return makeItem({ prompt: `What is the <b>median</b> of these numbers? &nbsp;${vals.join(', \u2009')}`, correct: On(med),
      ds: [On(unsorted, 'median_unsorted'), even ? On(R.pick([sorted[2], sorted[3]]), 'median_even') : null, isInt(mean) ? On(mean, 'mean_median_confuse') : null, On(mid, 'median_midrange')],
      fill: nearFill(med, [1, -1, 2, -2]),
      sol: `Put them in order: ${sorted.join(', ')}. ${even ? `The two middle numbers are ${sorted[2]} and ${sorted[3]}; halfway between them is ${num(med)}.` : `The middle number is ${med}.`}`,
      steps: [`Put the numbers in order from least to greatest: ${sorted.join(', ')}.`, even ? `There are ${n} numbers, so there are two middle numbers: ${sorted[2]} and ${sorted[3]}.` : `There are ${n} numbers. The middle one is the 4th: ${sorted[3]}.`, even ? `The median is halfway between them: (${sorted[2]} + ${sorted[3]}) ${DIVIDE} 2 = ${num(med)}.` : null] });
  }
};

G.range_iqr = () => {
  if (R.chance(0.55)) {
    for (;;) {
      const n = R.int(5, 7), vals = []; while (vals.length < n) { const v = R.int(3, 40); if (!vals.includes(v)) vals.push(v); }
      const mx = Math.max(...vals), mn = Math.min(...vals);
      if ([vals[0], vals[n - 1]].some(v => v === mx || v === mn)) continue;
      const fl = Math.abs(vals[n - 1] - vals[0]), r = mx - mn;
      if (new Set([r, mx, fl].map(kn)).size < 3) continue;
      return makeItem({ prompt: `What is the <b>range</b> of these numbers? &nbsp;${vals.join(', \u2009')}`, correct: On(r),
        ds: [On(mx, 'range_max'), On(fl, 'range_first_last'), On(mx + mn)], fill: nearFill(r, [1, -1, 2]),
        sol: `Range = largest ${MINUS} smallest = ${mx} ${MINUS} ${mn} = ${r}.`,
      steps: [`Find the largest number: ${mx}. Find the smallest: ${mn}. (Not the first and last numbers in the list.)`, `Range = largest ${MINUS} smallest = ${mx} ${MINUS} ${mn} = ${r}.`] });
    }
  }
  for (;;) {
    const v = []; let x = R.int(1, 6); for (let i = 0; i < 8; i++) { v.push(x); x += R.int(1, 5); }
    if ((v[1] + v[2]) % 2 || (v[5] + v[6]) % 2) continue;
    const q1 = (v[1] + v[2]) / 2, q3 = (v[5] + v[6]) / 2, iqr = q3 - q1, rng = v[7] - v[0];
    if (new Set([iqr, rng, q3, v[6] - v[1]].map(kn)).size < 4) continue;
    return makeItem({ prompt: `These numbers are in order: &nbsp;${v.join(', \u2009')}. What is the <b>interquartile range (IQR)</b>?`, correct: On(iqr),
      ds: [On(rng, 'iqr_range_confuse'), On(q3, 'iqr_q3'), On(v[6] - v[1], 'iqr_wrong_values')], fill: nearFill(iqr, [1, -1, 2]),
      sol: `Lower half ${v.slice(0, 4).join(', ')} has median ${q1} (Q1). Upper half ${v.slice(4).join(', ')} has median ${q3} (Q3). IQR = ${q3} ${MINUS} ${q1} = ${iqr}.`,
      steps: [`The numbers are in order. Split them in half: ${v.slice(0, 4).join(', ')} and ${v.slice(4).join(', ')}.`, `Q1 is the middle of the lower half: halfway between ${v[1]} and ${v[2]} is ${q1}.`, `Q3 is the middle of the upper half: halfway between ${v[5]} and ${v[6]} is ${q3}.`, `IQR = Q3 ${MINUS} Q1 = ${q3} ${MINUS} ${q1} = ${iqr}.`] });
  }
};

    if (r.st === 'solid' && r.sec > SLOW_SEC) { r.st = 'shaky'; r.slow = true; }
  }
  for (const x of ans) if (x.r.a >= 0 && x.r.a !== x.ans) { const m = x.o[x.r.a].m; if (m) r.mis[m] = (r.mis[m] || 0) + 1; }
  return r;
}
function allResults() { const R = {}; SKILLS.forEach(s => { R[s.id] = skillResult(s); }); return R; }
const isScored = r => ST_RANK[r.st] !== undefined;
// Ranking: weight (how much later math depends on the skill) x size of the gap; earlier-grade skills break ties.
function priorities(R) {
  return SKILLS.filter(s => DEFICIT[R[s.id].st]).map(s => ({ s, r: R[s.id], score: s.w * DEFICIT[R[s.id].st] }))
    .sort((a, b) => b.score - a.score || a.s.gm - b.s.gm || a.r.c / a.r.t - b.r.c / b.r.t);
}
function bandStats() {
  return BANDS.map(b => {
    let c = 0, t = 0;
    if (DB.cur) for (const d of Object.values(DB.cur.secs)) for (const x of d.q) if (x.r && b.has(SKILL[x.s].gm)) { t++; if (x.r.a === x.ans) c++; }
    return Object.assign({ c, t, pct: t ? Math.round(100 * c / t) : null }, b);
  });
}
function patterns(R) {
  const agg = {};
  SKILLS.forEach(s => { const r = R[s.id]; if (!r.mis) return; for (const m in r.mis) { const a = agg[m] = agg[m] || { n: 0, skills: [] }; a.n += r.mis[m]; a.skills.push(s.name); } });
  return Object.entries(agg).sort((a, b) => b[1].n - a[1].n);
}
function snapshot(R) {
  const skills = {};
  SKILLS.forEach(s => { const r = R[s.id]; if (isScored(r)) skills[s.id] = { st: r.st, c: r.c, t: r.t }; });
  return { date: DB.cur.started, name: DB.name, done: doneCount(), skills };
}

function chip(st, small) { return `<span class="chip ${st}${small ? ' sm' : ''}"><i aria-hidden="true"></i>${ST_LABEL[st]}</span>`; }

// ---------- report ----------
function gapsStartText(bands) {
  const weak = bands.find(b => b.t >= 4 && b.pct < 80);
  if (!weak) return bands.some(b => b.t) ? 'Most of the skills tested so far look solid.' : '';
  const before = bands.slice(0, bands.indexOf(weak)).filter(b => b.t >= 4).map(b => b.short);
  let s = before.length ? `${before.join(' and ').replace(/^g/, 'G')} skills look mostly solid. ` : '';
  if (weak.id === 'g34') s += `The gaps start early, with skills taught in grades 3 and 4 (${weak.pct}% right). Those skills show up inside most 6th-grade problems, so they are the best place to start.`;
  else if (weak.id === 'g5') s += `The gaps start with skills taught in grade 5 (${weak.pct}% right).`;
  else s += `The gaps are in grade 6 topics (${weak.pct}% right), which are taught this year.`;
  return s;
}
function bandRow(b) {
  if (!b.t) return `<div class="band"><span class="band-label">${b.label}</span><div class="band-bar"></div><span class="band-val muted">Not tested yet</span></div>`;
  const cls = b.pct >= 80 ? 'solid' : b.pct >= 60 ? 'shaky' : 'gap';
  return `<div class="band"><span class="band-label">${b.label}</span><div class="band-bar"><div class="band-fill ${cls}" style="width:${Math.max(b.pct, 1)}%"></div></div><span class="band-val"><b>${b.pct}%</b> right <span class="muted">(${b.c} of ${b.t})</span></span></div>`;
}
const slowNote = r => r.slow ? `, but slow (about ${r.sec.toFixed(1)} seconds each)` : '';
function resultLine(s, r) {
  const parts = [`Got ${r.c} of ${r.t} right.`];
  if (r.idk) parts.push(`Chose “I don’t know yet” ${r.idk === 1 ? 'once' : r.idk + ' times'}.`);
  if (s.fluency && r.sec != null) parts.push(`About ${r.sec.toFixed(1)} seconds per fact${r.slow ? ', so right but not automatic yet' : ''}.`);
  return parts.join(' ');
}
function priCard(x) {
  const s = x.s, r = x.r, mis = Object.keys(r.mis);
  return `<li class="pri">
    <div class="pri-head"><h3>${s.name}</h3>${chip(r.st)}</div>
    <p class="pri-meta">Grade ${s.g} skill. ${resultLine(s, r)}</p>
    ${mis.length ? `<div class="pri-mis"><p class="lead-in">Mistakes seen</p><ul>${mis.map(m => `<li>${MIS[m]}</li>`).join('')}</ul></div>` : ''}
    <p><span class="lead-in">Why it matters.</span> Needed for ${s.needs}.</p>
    <p><span class="lead-in">How to practice.</span> ${s.tip}</p>
    ${pracNote(s.id) ? `<p><span class="lead-in">Practice so far.</span> ${pracNote(s.id)}</p>` : ''}
    <div class="pri-foot"><p class="std">Common Core standard ${s.std}</p><button class="btn small no-print" data-act="practice" data-skill="${s.id}" data-back="report">Practice this skill</button></div>
  </li>`;
}
function compareText(R, prev) {
  let up = 0, down = 0, same = 0;
  for (const id in prev.skills) {
    const r = R[id]; if (!r || !isScored(r)) continue;
    const d = ST_RANK[r.st] - ST_RANK[prev.skills[id].st];
    if (d > 0) up++; else if (d < 0) down++; else same++;
  }
  if (!(up + down + same)) return '';
  return `Compared with the check-up started ${fmtDate(prev.date)}: ${up} ${plural(up, 'skill', 'skills')} improved, ${down} slipped, and ${same} stayed the same.`;
}
function skillRow(s, R, prev) {
  const r = R[s.id], p = prev && prev.skills[s.id];
  const res = r.t ? `${r.c} of ${r.t}` : '–';
  let was = '';
  if (prev) {
    if (!p) was = '<td class="was muted">–</td>';
    else if (isScored(r) && r.st !== p.st) was = `<td class="was">${ST_RANK[r.st] > ST_RANK[p.st] ? '<span class="up">Up from</span>' : '<span class="down">Down from</span>'} ${p.st === 'gap' ? 'gap' : p.st}</td>`;
    else was = `<td class="was muted">${ST_LABEL[p.st]}</td>`;
  }
  const st = isScored(r) ? r.st : r.st === 'partial' ? 'partial' : 'untested';
  return `<tr><td class="sk-name">${s.name}<span>Grade ${s.g}${r.slow ? `. Right but slow: about ${r.sec.toFixed(1)} seconds each` : ''}</span></td><td class="sk-res">${res}</td><td>${chip(st, true)}</td>${was}</tr>`;
}
function topicBlock(sec, R, prev) {
  const sk = secSkills(sec.id), c = { solid: 0, shaky: 0, gap: 0, untested: 0 };
  sk.forEach(s => { const st = R[s.id].st; c[isScored(R[s.id]) ? st : 'untested']++; });
  const seg = ['solid', 'shaky', 'gap', 'untested'].map(k => c[k] ? `<span class="seg ${k}" style="flex:${c[k]}"></span>` : '').join('');
  const words = ['solid', 'shaky', 'gap'].filter(k => c[k]).map(k => `${c[k]} ${k === 'gap' ? plural(c[k], 'gap', 'gaps') : k}`);
  if (c.untested) words.push(`${c.untested} not tested yet`);
  return `<div class="topic">
    <div class="topic-head"><h3>${sec.name}</h3><p class="muted">${words.join(', ')}</p></div>
    <div class="segbar" aria-hidden="true">${seg}</div>
    <table class="skills"><thead><tr><th>Skill</th><th>Right</th><th>Result</th>${prev ? '<th>Last time</th>' : ''}</tr></thead><tbody>${sk.map(s => skillRow(s, R, prev)).join('')}</tbody></table>
  </div>`;
}
function reviewItem(it) {
  const ok = it.r.a === it.ans, idk = it.r.a === -1;
  const opts = it.o.map((o, i) => {
    const tags = (i === it.r.a ? '<span class="tag picked-tag">Picked</span>' : '') + (i === it.ans ? '<span class="tag right-tag">Correct</span>' : '');
    return `<li class="${i === it.ans ? 'right' : ''}${i === it.r.a && !ok ? ' wrong' : ''}"><span class="key">${LETTERS[i]}</span><span class="val">${o.h}</span>${tags}</li>`;
  }).join('');
  return `<li class="rv ${ok ? 'ok' : 'no'}">
    <p class="rv-head"><span class="mark">${ok ? 'Right' : idk ? 'Didn’t know' : 'Wrong'}</span><span class="muted">${SKILL[it.s].name}${it.tb ? ' (extra question)' : ''}</span></p>
    <div class="rv-q">${it.p}</div>
    ${it.f ? `<div class="figure sm">${it.f}</div>` : ''}
    <ol class="rv-opts">${opts}</ol>
    ${it.st ? `<div class="rv-sol"><p class="lead-in">How to solve it</p>${it.w || ''}<ol class="steps">${it.st.map(x => `<li>${x}</li>`).join('')}</ol></div>` : `<p class="rv-sol"><span class="lead-in">Explanation.</span> ${it.sol}</p>`}
  </li>`;
}
function rightItem(it) {
  return `<li><span class="muted">${SKILL[it.s].name}:</span> ${it.p} <b class="rv-a">${it.o[it.ans].h}</b></li>`;
}
function reportView() {
  const R = allResults(), tested = SKILLS.filter(s => isScored(R[s.id]));
  const nm = DB.name ? esc(DB.name) : '';
  const title = nm ? `${nm}’s math <span class="nw">check-up</span>` : 'Math <span class="nw">check-up</span> report';
  const bar = topBar(`<div class="top-actions">${IN_VIEWER ? '' : '<button class="btn small" data-act="print">Print</button>'}<button class="btn small" data-act="copy" data-label="Copy summary">Copy summary</button></div>`);
  if (!tested.length) return `${bar}<div class="sheet"><h1>${title}</h1><p class="lede">No results yet. Results appear here as soon as she finishes a few questions in any section.</p><button class="btn primary" data-act="home">Go to sections</button></div>`;
  const counts = { solid: 0, shaky: 0, gap: 0 };

  const bands = bandStats(), prev = DB.hist.length ? DB.hist[DB.hist.length - 1] : null;
  const remaining = SECTIONS.filter(s => secStatus(s.id) !== 'done');
  const pats = patterns(R).filter(p => p[1].n >= 2);

  return `${bar}
  <article class="sheet report">

      ${remaining.length ? `<p class="callout">Not finished yet: ${remaining.map(s => s.name).join(', ')}. The report fills in as those sections are done.</p>` : ''}
      <p class="note">This check-up isn’t a percentile test, so it can’t give a percentile. It shows which skills are solid and which are missing, and ranks the gaps by how much other math depends on them. Each skill gets only two to four questions, so look for patterns rather than single answers.</p>
    </header>

    <section class="rep-sec">
      <h2>Where the gaps start</h2>
      <div class="bands">${bands.map(bandRow).join('')}</div>
      <p>${gapsStartText(bands)}</p>
      <p>Of the ${tested.length} skills tested, ${counts.solid} ${plural(counts.solid, 'is', 'are')} solid, ${counts.shaky} ${plural(counts.shaky, 'is', 'are')} shaky, and ${counts.gap} ${plural(counts.gap, 'is a gap', 'are gaps')}.${cmp ? ' ' + cmp : ''}</p>
    </section>

    <section class="rep-sec">
      <h2>Start here</h2>
      ${top.length ? `<p>Work on these in order. About 15 to 20 minutes a day on one skill until it feels easy, then move to the next.</p><ol class="pris">${top.map(priCard).join('')}</ol>`
        : '<p>No gaps found in the skills tested so far.</p>'}
      ${more.length ? `<h3 class="sub">After that</h3><ul class="more">${more.map(x => `<li><span class="nm">${x.s.name}</span><span class="muted">Grade ${x.s.g}. ${x.r.c} of ${x.r.t} right${slowNote(x.r)}.</span>${chip(x.r.st, true)}<button class="link no-print" data-act="practice" data-skill="${x.s.id}" data-back="report">Practice</button></li>`).join('')}</ul>` : ''}
    </section>

    ${practiceSection()}

    ${pats.length ? `<section class="rep-sec">
      <h2>Mistakes made more than once</h2>
      <p>The same kind of wrong answer, chosen on different questions. These are habits worth fixing directly.</p>
      <ul class="pats">${pats.map(([m, v]) => `<li><p>${MIS[m]}</p><p class="muted">${v.n} times, in ${v.skills.join('; ')}</p></li>`).join('')}</ul>
    </section>` : ''}

    <section class="rep-sec">
      <h2>Every skill</h2>
      <p class="muted">Solid: all right. Shaky: mostly right, or right but slow on facts. Gap: mostly wrong.</p>

    <section class="rep-sec">
      <h2>Question review</h2>

        const items = secData(sec.id).q.filter(x => x.r), got = items.filter(x => x.r.a === x.ans), missed = items.filter(x => x.r.a !== x.ans);
        return `<details class="review" data-key="${sec.id}"><summary><span class="rs-name">${sec.name}</span><span class="muted">${got.length} of ${items.length} right</span></summary>

          ${got.length ? `<p class="rv-group">Right (${got.length})</p><ul class="rv-right">${got.map(rightItem).join('')}</ul>` : ''}
        </details>`;
      }).join('')}
    </section>

    <footer class="actions no-print">
      ${IN_VIEWER ? '' : '<button class="btn" data-act="print">Print report</button>'}
      <button class="btn" data-act="copy" data-label="Copy summary">Copy summary</button>
      <button class="btn" data-act="ask-new">Start a new check-up</button>
      <button class="link danger" data-act="ask-erase">Erase all saved data</button>
    </footer>
  </article>`;
}

// ---------- practice ----------
// Unlimited questions for one skill, each followed by its worked solution. Five right in a row masters the skill.
const MASTER = 5;
let P = null;
const pracStat = id => Object.assign({ n: 0, c: 0, streak: 0, best: 0, mastered: 0, last: 0 }, DB.prac[id]);
function pracNote(id) {
  const st = DB.prac[id];
  if (!st || !st.n) return '';
  return st.mastered ? `mastered (${MASTER} in a row) on ${fmtDate(st.mastered)}, ${st.c} of ${st.n} right overall` : `${st.c} of ${st.n} right, best streak ${st.best}`;
}
const practiced = () => Object.keys(DB.prac).filter(id => SKILL[id] && DB.prac[id].n).sort((a, b) => (DB.prac[b].last || 0) - (DB.prac[a].last || 0));
function practiceSection() {
  const ids = practiced();
  if (!ids.length) return '';
  const short = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return `<section class="rep-sec">
      <h2>Practice</h2>
      <p>Questions answered in practice mode, most recent first. A skill counts as mastered after ${MASTER} right in a row without help.</p>
      <table class="skills prac-table"><thead><tr><th>Skill</th><th>Right</th><th>Best streak</th><th>Last practiced</th></tr></thead><tbody>${ids.map(id => {
        const s = SKILL[id], st = DB.prac[id];
        return `<tr><td class="sk-name">${s.name}<span>${st.mastered ? `<b class="mastered-note">Mastered ${fmtDate(st.mastered)}</b>` : `Grade ${s.g}`}</span></td><td class="sk-res">${st.c} of ${st.n}</td><td class="sk-res">${st.best}</td><td class="sk-res">${short(st.last)}</td></tr>`;
      }).join('')}</tbody></table>
    </section>`;
}
function practiceCta(list, lead) {
  if (!list.length) return '';
  return `<div class="prac-cta"><p>${lead}</p><div class="row-btns">${list.map(x => `<button class="btn" data-act="practice" data-skill="${x.s.id}" data-back="home">${x.s.name}</button>`).join('')}</div></div>`;
}
// "Forgets to carry..." becomes "usually forgets to carry...", and "Is off by one..." becomes "is usually off by one...".
function usually(text) {
  const t = text.charAt(0).toLowerCase() + text.slice(1);
  return t.startsWith('is ') ? 'is usually ' + t.slice(3) : 'usually ' + t;
}
function startPractice(id, back) {
  P = { skill: id, back: back || 'home', it: null, recent: [], chosen: -1, checked: false, shown: false, msg: '', n: 0, c: 0, mastered: false };
  nextPractice();
  go('practice');
}
function nextPractice() {
  P.it = makeQ(P.skill, P.recent);
  P.recent.push(P.it); if (P.recent.length > 6) P.recent.shift();
  P.chosen = -1; P.checked = false; P.shown = false; P.msg = ''; P.mastered = false;
  selected = -1;
}
function checkPractice(showOnly) {
  if (!P || P.checked || (!showOnly && P.chosen < 0) || Date.now() < lockUntil) return;
  P.checked = true;
  if (showOnly) {
    P.shown = true; P.msg = 'Here’s how to solve it. Try the next one on your own.';
    const st = DB.prac[P.skill]; if (st && st.streak) { st.streak = 0; save(); }
  }
  else {
    const ok = P.chosen === P.it.ans, st = DB.prac[P.skill] = pracStat(P.skill);
    st.n++; st.last = Date.now(); P.n++;
    if (ok) {
      st.c++; st.streak++; st.best = Math.max(st.best, st.streak); P.c++;
      if (st.streak >= MASTER && !st.mastered) { st.mastered = Date.now(); P.mastered = true; }
      P.msg = R.pick(['Right!', 'Yes, that’s it.', 'Correct!', 'Nice work.']);
    } else { st.streak = 0; P.msg = `Not quite. The answer is ${LETTERS[P.it.ans]}.`; }
    save();
  }
  render();
  const fb = app.querySelector('.feedback');
  if (fb) { fb.focus({ preventScroll: true }); fb.scrollIntoView({ block: 'nearest' }); }
}
function practiceView() {
  const s = SKILL[P.skill], it = P.it, st = pracStat(P.skill);
  const longOpts = it.o.some(o => textOf(o.h).length > 24), longPrompt = textOf(it.p).length > 130;
  const dots = Array.from({ length: MASTER }, (_, i) => `<span class="sdot${i < Math.min(st.streak, MASTER) ? ' on' : ''}"></span>`).join('');
  const goal = st.streak >= MASTER ? `${st.streak} in a row. Mastered!` : st.mastered ? `${st.streak} in a row. You’ve mastered this one, so this is extra practice.` : `${st.streak} in a row. Get ${MASTER} in a row to master it.`;
  const opts = it.o.map((o, i) => {
    let cls = 'opt';
    if (P.checked) { if (i === it.ans) cls += ' right'; else if (i === P.chosen) cls += ' wrong'; } else if (i === P.chosen) cls += ' sel';
    return `<button class="${cls}" data-act="pick" data-i="${i}" aria-pressed="${i === P.chosen}"${P.checked ? ' disabled' : ''}><span class="key">${LETTERS[i]}</span><span class="val">${o.h}</span></button>`;
  }).join('');
  const ok = P.checked && !P.shown && P.chosen === it.ans, mixup = P.checked && !ok && !P.shown && P.chosen >= 0 ? it.o[P.chosen].m : null;
  const steps = it.st || [it.sol];
  return `<div class="test practice">
    <header class="test-top"><span class="sec-name">Practice</span><button class="link" data-act="prac-back">Done practicing</button></header>
    <h1 class="prac-title">${s.name}</h1>
    <div class="streak"><span class="sdots" aria-hidden="true">${dots}</span><span>${goal}</span>${P.n ? `<span class="muted">This time: ${P.c} of ${P.n} right</span>` : ''}</div>
    <section class="qcard${it.big ? ' big' : ''}${longPrompt ? ' long' : ''}">
      <h2 class="prompt" tabindex="-1">${it.p}</h2>
      ${it.f ? `<div class="figure">${it.f}</div>` : ''}
    </section>
    <div class="opts${longOpts ? ' one-col' : ''}" role="group" aria-label="Answer choices">${opts}</div>
    ${P.checked ? `
    <div class="feedback ${P.shown ? 'shown' : ok ? 'ok' : 'no'}" tabindex="-1" role="status">
      <p class="fb-head">${P.msg}</p>
      ${mixup ? `<p><b>Common mix-up.</b> Someone who picks this answer ${usually(MIS[mixup])}</p>` : ''}
      ${P.mastered ? `<p class="fb-master">That’s ${MASTER} in a row. You’ve mastered this skill!</p>` : ''}
    </div>
    <section class="worked">
      <h2>How to solve it</h2>
      ${it.w || ''}
      <ol class="steps">${steps.map(x => `<li>${x}</li>`).join('')}</ol>
    </section>
    <div class="test-actions end"><button class="btn primary" data-act="prac-next">Next question</button></div>`
    : `<div class="test-actions"><button class="btn ghost" data-act="prac-show">Show me how</button><button class="btn primary" data-act="prac-check"${P.chosen < 0 ? ' disabled' : ''}>Check</button></div>`}
  </div>`;
}
function practiceHomeView() {
  const R = allResults(), pri = priorities(R).slice(0, 5);
  const row = s => {
    const r = R[s.id], st = DB.prac[s.id];
    const meta = [`Grade ${s.g}.`, st && st.n ? `Practiced ${st.n}, ${st.c} right.` : ''].join(' ');
    return `<li class="prow">
      <div class="prow-info"><span class="nm">${s.name}</span><span class="muted">${meta}</span></div>
      <div class="prow-tags">${isScored(r) ? chip(r.st, true) : ''}${st && st.mastered ? '<span class="chip mastered sm"><i aria-hidden="true"></i>Mastered</span>' : ''}</div>
      <button class="btn small" data-act="practice" data-skill="${s.id}" data-back="practice-home">Practice</button>
    </li>`;
  };
  return `${topBar('<button class="btn small" data-act="home">Back to sections</button>')}
  <section class="hero prac-hero">
    <h1>Practice</h1>
    <p class="lede">Pick a skill. After each answer you’ll see if it’s right and how to work it out. Get ${MASTER} in a row on your own to master a skill. The questions never run out.</p>
  </section>
  ${pri.length ? `<section class="sheet plist-sheet"><h2>Start with these</h2><p class="muted">The skills the check-up says will help most, in order.</p><ul class="plist">${pri.map(x => row(x.s)).join('')}</ul></section>`
    : '<p class="sync-note">Take the check-up first to see which skills to start with, or pick any skill below.</p>'}
  <section class="sheet plist-sheet">
    <h2>All skills</h2>
    ${SECTIONS.map(sec => `<details class="psec" data-key="p-${sec.id}"><summary><span>${sec.name}</span><span class="muted">${sec.grades.includes('\u2013') ? 'Grades' : 'Grade'} ${sec.grades}</span></summary><ul class="plist">${secSkills(sec.id).map(s => row(s)).join('')}</ul></details>`).join('')}
  </section>`;
}

// ---------- copyable summary ----------
function plain(html) {
  const el = document.createElement('div');
  el.innerHTML = html.replace(/<span class="fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g, '$1/$2');
  return el.textContent.replace(/\s+/g, ' ').trim();
}
function summaryText() {
  const R = allResults();
  if (!DB.cur || !SKILLS.some(s => isScored(R[s.id]))) return '';
  const L = [`${DB.name ? DB.name + '\u2019s math check-up' : 'Math check-up'} (started ${fmtDate(DB.cur.started)}, ${doneCount()} of ${SECTIONS.length} sections finished)`, '', 'Where the gaps start'];
  bandStats().forEach(b => L.push(`- ${b.label}: ${b.t ? `${b.pct}% right (${b.c} of ${b.t})` : 'not tested yet'}`));
  const pri = priorities(R);
  if (pri.length) {
    L.push('', 'Start here');
    pri.slice(0, 5).forEach((x, i) => {
      L.push(`${i + 1}. ${x.s.name}, grade ${x.s.g} (${x.s.std}): ${ST_LABEL[x.r.st].toLowerCase()}, ${x.r.c} of ${x.r.t} right${slowNote(x.r)}.`);
      Object.keys(x.r.mis).forEach(m => L.push(`   Mistake seen: ${plain(MIS[m])}`));
      L.push(`   How to practice: ${plain(x.s.tip)}`);
    });
    if (pri.length > 5) L.push('', 'After that: ' + pri.slice(5).map(x => `${x.s.name} (${ST_LABEL[x.r.st].toLowerCase()})`).join('; ') + '.');
  }
  const pats = patterns(R).filter(p => p[1].n >= 2);
  if (pats.length) { L.push('', 'Mistakes made more than once'); pats.forEach(([m, v]) => L.push(`- ${plain(MIS[m])} (${v.n} times)`)); }
  const pr = practiced();
  if (pr.length) {
    L.push('', 'Practice');
    pr.forEach(id => { const st = DB.prac[id]; L.push(`- ${SKILL[id].name}: ${st.c} of ${st.n} right, best streak ${st.best}${st.mastered ? `, mastered ${fmtDate(st.mastered)}` : ''}.`); });
  }
  return L.join('\n');
}
function copySummary(btn) {
  const text = summaryText();
  if (!text) return;
  const label = btn.dataset.label || btn.textContent;
  const copied = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = label; }, 1600); };
  try { navigator.clipboard.writeText(text).then(copied, () => showText(text)); } catch (e) { showText(text); }
}
function showText(text) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'modal-wrap';
  m.innerHTML = '<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">Copy the summary</h2><p>Select the text below and copy it.</p><textarea id="summary-text" readonly rows="12"></textarea><div class="row-btns"><button class="btn" data-act="close-modal">Close</button></div></div>';
  document.body.appendChild(m);
  const ta = m.querySelector('textarea');
  ta.value = text; ta.focus(); ta.select();
}

// ---------- actions ----------
function go(name, extra) {
  view = Object.assign({ name }, extra || {});
  selected = -1;
  render();
  window.scrollTo(0, 0);
}
function render() {
  if (view.name === 'test' && (!secData(view.sec) || secData(view.sec).done)) view = { name: 'home' };
  const v = view.name;
  document.body.dataset.view = v;
  if (v === 'practice' && !P) { view = { name: 'practice-home' }; return render(); }
  app.innerHTML = v === 'intro' ? introView(view.sec) : v === 'test' ? testView(view.sec) : v === 'done' ? doneView(view.sec) : v === 'report' ? reportView() : v === 'practice' ? practiceView() : v === 'practice-home' ? practiceHomeView() : homeView();
  if (v === 'test' || (v === 'practice' && !P.checked)) {
    shownAt = Date.now(); lockUntil = shownAt + 350;
    const h = app.querySelector('.prompt'); if (h) h.focus({ preventScroll: true });
  }
}
function openSection(id) { go(secStatus(id) === 'active' ? 'test' : 'intro', { sec: id }); }
function beginSection(id) {
  if (!DB.cur) DB.cur = { started: Date.now(), secs: {} };
  if (!DB.cur.secs[id]) { DB.cur.secs[id] = buildSection(id); save(id); }
  go('test', { sec: id });
}
function pick(i) {
  const inPractice = view.name === 'practice' && P && !P.checked;
  if ((view.name !== 'test' && !inPractice) || Date.now() < lockUntil || i < 0 || i > 3) return;
  selected = i;
  if (inPractice) P.chosen = i;
  app.querySelectorAll('.opt').forEach((b, j) => { b.classList.toggle('sel', j === i); b.setAttribute('aria-pressed', String(j === i)); });
  const nx = app.querySelector('[data-act=next], [data-act=prac-check]'); if (nx) nx.disabled = false;
}
function answer(choice) {
  if (view.name !== 'test' || Date.now() < lockUntil) return;
  const d = secData(view.sec); if (!d || d.done) return;
  const it = d.q[d.i];
  it.r = { a: choice, ms: Math.max(0, Date.now() - shownAt) };
  const mine = d.q.filter(x => x.s === it.s);
  if (mine.every(x => x.r) && !mine.some(x => x.tb)) {
    const c = mine.filter(x => x.r.a === x.ans).length;
    if (needsTiebreak(c, mine.length)) { const tb = makeQ(it.s, d.q); tb.tb = true; d.q.push(tb); }
  }
  d.i++;
  if (d.i >= d.q.length) { d.done = true; d.t1 = Date.now(); }
  selected = -1;
  save(view.sec);
  if (d.done) go('done', { sec: view.sec }); else render();
}
function startNew() {
  if (DB.cur && answeredCount()) { DB.hist.push(snapshot(allResults())); if (DB.hist.length > 12) DB.hist.shift(); }
  DB.cur = null; saveAll(); closeModal(); go('home');
}
function eraseAll() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* storage blocked */ }
  DB = freshState(); saveAll(); closeModal(); go('home');
}
function modal(title, body, okAct, okLabel, danger) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'modal-wrap';
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">${title}</h2><p>${body}</p>
    <div class="row-btns"><button class="btn ${danger ? 'danger-btn' : 'primary'}" data-act="${okAct}">${okLabel}</button><button class="btn" data-act="close-modal">Cancel</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('[data-act=close-modal]').focus();
}
function closeModal() { document.querySelectorAll('.modal-wrap').forEach(n => n.remove()); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const sec = b.dataset.sec;
  switch (b.dataset.act) {
    case 'home': case 'pause': go('home'); break;
    case 'report': go('report'); break;
    case 'open': openSection(sec); break;
    case 'begin': beginSection(sec); break;
    case 'pick': pick(+b.dataset.i); break;
    case 'practice-home': go('practice-home'); break;
    case 'practice': startPractice(b.dataset.skill, b.dataset.back); break;
    case 'prac-check': checkPractice(false); break;
    case 'prac-show': checkPractice(true); break;
    case 'prac-next': if (P) { nextPractice(); render(); window.scrollTo(0, 0); } break;
    case 'prac-back': { const back = P ? P.back : 'home'; P = null; go(back === 'report' ? 'report' : back === 'practice-home' ? 'practice-home' : 'home'); break; }
    case 'next': if (selected >= 0) answer(selected); break;
    case 'idk': answer(-1); break;
    case 'copy': copySummary(b); break;
    case 'print': window.print(); break;
    case 'ask-new': modal('Start a new check-up?', `A summary of this one is kept, so the next report can show what changed. The individual answers are cleared, so ${IN_VIEWER ? 'copy the summary' : 'print or copy the report'} first if you want to keep it. Practice records are kept.`, 'do-new', 'Start new check-up'); break;
    case 'do-new': startNew(); break;
    case 'ask-erase': modal('Erase all saved data?', 'This deletes every answer, past result and practice record. It can’t be undone.', 'do-erase', 'Erase everything', true); break;
    case 'do-erase': eraseAll(); break;
    case 'close-modal': closeModal(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'kid-name') { DB.name = e.target.value.trim().slice(0, 30); save(null, 900); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); return; }
  if (view.name === 'practice' && P && !document.querySelector('.modal-wrap') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const k = e.key.toLowerCase(), i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (!P.checked && k.length === 1 && i >= 0) { pick(i); e.preventDefault(); }
    else if (e.key === 'Enter' && !e.target.closest('button')) {
      if (P.checked) { nextPractice(); render(); window.scrollTo(0, 0); } else if (P.chosen >= 0) checkPractice(false);
      e.preventDefault();
    }
    return;
  }
  if (view.name !== 'test' || document.querySelector('.modal-wrap') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (k.length === 1 && i >= 0) { pick(i); e.preventDefault(); }
  else if (e.key === 'Enter' && selected >= 0 && !e.target.closest('button')) { answer(selected); e.preventDefault(); }
});

render();
connectRemote();

})();
</script>
