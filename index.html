  --line: #2B3955; --line-strong: #4C5E80; --wood: #D3A86C; --mark: #84B4FF; --hl: #3B3214;
  --shape: #2B2817; --shape-2: #3B3519; --shape-3: #4C431D;
  --solid: #8FDFB5; --solid-bg: #183528; --shaky: #F4C27D; --shaky-bg: #3A2B13;
  --gap: #FFA392; --gap-bg: #3E1F19; --mute: #A9B6CB; --mute-bg: #222D41; --focus: #84B4FF;
  --on-gap: #2A0F0A; --scrim: rgba(0, 0, 0, .62);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  font: 400 17px/1.55 var(--font);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
}
#app {
  max-width: 840px; margin: 0 auto; padding-block: 18px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body[data-view="test"] #app, body[data-view="practice"] #app { max-width: 760px; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
h1 { font-size: 2.05rem; letter-spacing: -0.01em; }
p { margin: 0 0 12px; }
b { font-weight: 700; }
.muted { color: var(--ink-2); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.prompt:focus, .prompt:focus-visible { outline: none; }

/* ---------- buttons ---------- */
.btn {
  font: inherit; font-weight: 700; color: var(--ink); background: var(--card);
  border: 2px solid var(--ink); border-radius: 12px; padding: 11px 22px; cursor: pointer;
  box-shadow: 0 3px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--pencil); color: var(--on-pencil); }
.btn.big { font-size: 1.12rem; padding: 14px 28px; }
.btn.small { padding: 7px 14px; font-size: .95rem; box-shadow: 0 2px 0 var(--ink); }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn.ghost { border-color: transparent; box-shadow: none; background: transparent; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; padding-left: 4px; }
.btn.ghost:hover { color: var(--ink); }
.btn.danger-btn { background: var(--gap); color: var(--on-gap); border-color: var(--gap); box-shadow: 0 3px 0 var(--ink); }
.link { font: inherit; background: none; border: 0; padding: 4px 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link:hover { color: var(--ink); }
.link.danger { color: var(--gap); }
.row-btns { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.center .row-btns { justify-content: center; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; font-size: 1.12rem; color: var(--ink); background: none; border: 0; padding: 2px 4px 2px 0; cursor: pointer; }
.ico-pencil { flex: none; }

/* ---------- pencil progress ---------- */
.pencil { position: relative; height: 18px; padding-right: 18px; }
.pencil::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: repeating-linear-gradient(90deg, var(--line-strong) 0 7px, transparent 7px 12px); }
.pencil-fill {
  position: relative; height: 100%; min-width: 26px; border-radius: 4px 0 0 4px;
  background: linear-gradient(180deg, var(--pencil-lt) 0 33%, var(--pencil) 33% 67%, var(--pencil-dk) 67% 100%);
  transition: width .45s cubic-bezier(.2, .7, .3, 1);
}
.pencil-fill::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 15px; border-radius: 4px 0 0 4px; background: linear-gradient(90deg, var(--eraser) 0 9px, #9AA4B2 9px 10px, var(--ferrule) 10px 15px); }
.pencil-fill::after { content: ""; position: absolute; top: 0; bottom: 0; right: -18px; width: 18px; background: linear-gradient(90deg, var(--wood) 0 64%, var(--lead) 64%); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.pencil.small { height: 10px; padding-right: 10px; }
.pencil.small .pencil-fill { min-width: 16px; border-radius: 2px 0 0 2px; }
.pencil.small .pencil-fill::before { width: 8px; border-radius: 2px 0 0 2px; background: linear-gradient(90deg, var(--eraser) 0 5px, var(--ferrule) 5px 8px); }
.pencil.small .pencil-fill::after { right: -10px; width: 10px; }

/* ---------- home ---------- */
.hero { margin: 26px 0 22px; }
.hero h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); max-width: 17ch; }
.lede { font-size: 1.12rem; color: var(--ink-2); max-width: 60ch; margin-top: 12px; }
.name-field { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; margin-top: 20px; }
.name-field span { font-weight: 700; }
.name-field input { font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--line-strong); border-radius: 10px; padding: 9px 13px; width: 230px; max-width: 100%; }
.name-field input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
.warn { background: var(--shaky-bg); color: var(--shaky); border-radius: 10px; padding: 10px 14px; font-weight: 700; }
.secs { list-style: none; margin: 0; padding: 0; background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); overflow: hidden; }
.sec { display: grid; grid-template-columns: minmax(0, 1fr) 170px 118px; gap: 18px; align-items: center; padding: 16px 20px; border-top: 1.5px solid var(--line); }
.sec:first-child { border-top: 0; }
.sec h3 { font-size: 1.1rem; margin-bottom: 3px; }
.sec-info p { margin: 0; color: var(--ink-2); font-size: .93rem; }
.sec-prog span { display: block; margin-top: 7px; font-size: .86rem; color: var(--ink-2); }
.sec-go { text-align: right; }
.sec-go .btn { min-width: 108px; }
.finished { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--solid); padding-right: 6px; }
.how { margin: 26px 0 0; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px 20px; }
.how summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
.how ul { margin: 0 0 16px; padding-left: 20px; }
.how li { margin: 6px 0; max-width: 70ch; }
.fine { margin-top: 18px; font-size: .95rem; color: var(--ink-2); }
@media (max-width: 640px) {
  .sec { grid-template-columns: minmax(0, 1fr) auto; gap: 12px 14px; padding: 15px 16px; }
  .sec-prog { grid-column: 1 / -1; grid-row: 2; }
  .sec-go .btn { min-width: 0; }
}

/* ---------- sheets ---------- */
.narrow { max-width: 640px; margin: 0 auto; }
.back { margin: 6px 0 14px; }
.sheet { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 30px clamp(18px, 5vw, 40px); }
.sheet.center { text-align: center; }
.intro-sheet h1 { font-size: 2rem; }
.rules { margin: 18px 0 26px; padding-left: 22px; font-size: 1.08rem; }
.rules li { margin: 8px 0; }
.done-sheet .pencil { max-width: 280px; margin: 0 auto 22px; }
.done-sheet h1 { margin-bottom: 10px; }
.done-sheet .lede { margin-left: auto; margin-right: auto; }
.done-sheet .row-btns { margin-top: 22px; }

/* ---------- test ---------- */
.test-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.sec-name { font-weight: 700; color: var(--ink-2); }
.test-top .link { white-space: nowrap; }
.prog { display: flex; align-items: center; gap: 14px; }
.prog .pencil { flex: 1; }
.count { flex: none; font-size: .95rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.qcard { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 24px clamp(18px, 4vw, 30px) 26px; margin: 18px 0 20px; }
.prompt { font-size: 1.42rem; font-weight: 400; line-height: 1.5; }
.qcard.long .prompt { font-size: 1.28rem; }
.qcard.big { padding: 34px 20px 36px; }
.qcard.big .prompt { font-size: clamp(2.3rem, 9vw, 3.1rem); font-weight: 700; text-align: center; letter-spacing: .01em; }
.figure { margin-top: 18px; overflow-x: auto; }
.figure svg { display: block; max-width: 100%; height: auto; }
.figure.sm svg { max-width: min(100%, 360px); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opts.one-col { grid-template-columns: 1fr; }
.opt {
  display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 12px 16px;
  font: inherit; font-size: 1.24rem; text-align: left; color: var(--ink); background: var(--card);
  border: 2px solid var(--line-strong); border-radius: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.opts.one-col .opt { font-size: 1.1rem; }
.opt:not(:disabled):hover { border-color: var(--ink); }
.opt.sel { border-color: var(--ink); background: var(--hl); box-shadow: inset 0 0 0 1.5px var(--ink); }
.key { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); font-size: 1rem; font-weight: 700; }
.opt.sel .key { background: var(--pencil); color: var(--on-pencil); border-color: var(--on-pencil); }
.test-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; }
.test-actions .btn.primary { min-width: 140px; font-size: 1.1rem; padding: 13px 26px; }
.keys-hint { margin-top: 26px; font-size: .85rem; color: var(--ink-2); text-align: center; }
@media (max-width: 560px) {
  .opts { grid-template-columns: 1fr; }
  .keys-hint { display: none; }
}
@media (hover: none) { .keys-hint { display: none; } }

/* ---------- math typesetting ---------- */
.fr { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle; text-align: center; font-size: .84em; line-height: 1.12; margin: 0 .1em; }
.fr > span { padding: 0 .16em; }
.fr > span:first-child { border-bottom: max(1.5px, .075em) solid currentColor; padding-bottom: .06em; }
.fr > span:last-child { padding-top: .06em; }
.mx { white-space: nowrap; }
.mx .fr { margin-left: .16em; }
sup { font-size: .68em; line-height: 0; }
.prompt i, .val i, .rv-q i, .rv-opts i { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 1.08em; }
.dt { border-collapse: collapse; font-size: 1.06rem; }
.dt th, .dt td { border: 2px solid var(--line-strong); padding: 8px 14px; text-align: center; font-variant-numeric: tabular-nums; }
.dt th { text-align: left; font-weight: 700; background: var(--paper); }
.dt td.q { background: var(--hl); font-weight: 700; }

/* ---------- figures ---------- */
.fig text { fill: var(--ink); font-family: var(--font); font-size: 17px; }
.fig .sm { font-size: 15px; }
.fig .xs { font-size: 12px; fill: var(--ink-2); }
.fig .lb { font-weight: 700; font-size: 17px; }
.fig .ax, .fig .tk { stroke: var(--ink); stroke-width: 2; }
.fig .ah { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .gl { stroke: var(--line); stroke-width: 1; }
.fig .pt { fill: var(--mark); }
.fig .ray { stroke: var(--mark); stroke-width: 5; stroke-linecap: round; }
.fig .rayh { fill: var(--mark); }
.fig .dotc { fill: var(--mark); stroke: var(--mark); stroke-width: 3; }
.fig .doto { fill: var(--card); stroke: var(--mark); stroke-width: 3; }
.fig .shape { fill: var(--shape); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.fig .shape.f2 { fill: var(--shape-2); }
.fig .shape.f3 { fill: var(--shape-3); }
.fig .dash { stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 5 4; }
.fig .thin { stroke: var(--ink); stroke-width: 1.6; fill: none; }

/* ---------- report ---------- */
.report { padding-top: 34px; }
.rep-head h1 { font-size: clamp(1.8rem, 5vw, 2.3rem); margin-bottom: 8px; }
.callout { background: var(--hl); border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
.note { font-size: .95rem; color: var(--ink-2); max-width: 72ch; margin-top: 14px; }
.rep-sec { border-top: 2px solid var(--line); margin-top: 28px; padding-top: 24px; }
.rep-sec h2 { font-size: 1.45rem; margin-bottom: 14px; }
.rep-sec > p { max-width: 70ch; }
.sub { font-size: 1.12rem; margin: 26px 0 10px; }
.bands { display: grid; gap: 10px; margin: 4px 0 18px; }
.band { display: grid; grid-template-columns: 150px minmax(0, 1fr) 170px; gap: 14px; align-items: center; }
.band-label { font-weight: 700; }
.band-bar { height: 16px; border-radius: 8px; background: var(--mute-bg); overflow: hidden; }
.band-fill { height: 100%; border-radius: 8px; }
.band-fill.solid { background: var(--solid); }
.band-fill.shaky { background: var(--pencil-dk); }
.band-fill.gap { background: var(--gap); }
.band-val { font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  .band { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .band-bar { grid-column: 1 / -1; grid-row: 2; }
}
.chip { display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; font-size: .9rem; font-weight: 700; padding: 3px 11px 3px 9px; border-radius: 999px; background: var(--mute-bg); color: var(--mute); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.chip i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
.chip.solid { background: var(--solid-bg); color: var(--solid); }
.chip.solid i { background: currentColor; }
.chip.shaky { background: var(--shaky-bg); color: var(--shaky); }
.chip.shaky i { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.chip.gap { background: var(--gap-bg); color: var(--gap); }
.chip.untested i, .chip.partial i { border-style: dotted; }
.chip.sm { font-size: .82rem; padding: 2px 9px 2px 7px; }
.chip.sm i { width: 8px; height: 8px; }
.pris { list-style: none; counter-reset: pri; margin: 18px 0 0; padding: 0; display: grid; gap: 14px; }
.pri { counter-increment: pri; position: relative; border: 2px solid var(--ink); border-radius: 14px; padding: 18px 20px 14px 70px; break-inside: avoid; }
.pri::before { content: counter(pri); position: absolute; left: 18px; top: 16px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; background: var(--pencil); color: var(--on-pencil); border: 2px solid var(--on-pencil); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pri-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.pri-head h3 { font-size: 1.18rem; }
.pri-meta { color: var(--ink-2); }
.pri p, .pri li { max-width: 68ch; }
.pri-mis ul { margin: 4px 0 12px; padding-left: 20px; }
.pri-mis li { margin: 3px 0; }
.lead-in { font-weight: 700; }
p.lead-in { margin: 0; }
.std { font-size: .88rem; color: var(--ink-2); margin: 0; }
@media (max-width: 520px) { .pri { padding: 62px 16px 12px; } .pri::before { left: 16px; top: 14px; } }
.more { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--line); }
.more li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 12px; align-items: center; padding: 10px 2px; border-bottom: 1.5px solid var(--line); }
.more .nm { font-weight: 700; }
.more .muted { grid-column: 1; font-size: .92rem; }
.more .chip { grid-column: 2; grid-row: 1 / span 2; }
.more .link { grid-column: 3; grid-row: 1 / span 2; }
.pats { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pats li { border-left: 5px solid var(--gap); background: var(--paper); border-radius: 0 10px 10px 0; padding: 10px 14px; break-inside: avoid; }
.pats p { margin: 0; }
.pats p.muted { font-size: .92rem; margin-top: 2px; }
.topic { margin: 24px 0 0; break-inside: avoid; }
.topic-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.topic-head h3 { font-size: 1.15rem; }
.topic-head p { margin: 0; font-size: .92rem; }
.segbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 6px; gap: 2px; }
.seg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.seg.solid { background: var(--solid); } .seg.shaky { background: var(--pencil-dk); } .seg.gap { background: var(--gap); } .seg.untested { background: var(--mute-bg); }
.skills { width: 100%; border-collapse: collapse; font-size: .97rem; }
.skills th { text-align: left; font-size: .82rem; font-weight: 700; color: var(--ink-2); padding: 6px 8px 6px 0; border-bottom: 1.5px solid var(--line); }
.skills td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.sk-name { font-weight: 700; }
.sk-name span { display: block; font-weight: 400; font-size: .85rem; color: var(--ink-2); }
.sk-res { white-space: nowrap; font-variant-numeric: tabular-nums; }
.was { font-size: .88rem; }
.up { color: var(--solid); font-weight: 700; }
.down { color: var(--gap); font-weight: 700; }
.review { border: 1.5px solid var(--line); border-radius: 12px; margin: 10px 0; padding: 0 16px; }
.review summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-weight: 700; }
.review summary .muted { font-weight: 400; }
.rv-list { list-style: none; margin: 0; padding: 0 0 8px; }
.rv { border-top: 1px solid var(--line); padding: 16px 0; }
.rv:first-child { border-top: 0; }
.rv-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; font-size: .92rem; }
.mark { font-weight: 700; padding: 1px 9px; border-radius: 6px; }
.rv.ok .mark { background: var(--solid-bg); color: var(--solid); }
.rv.no .mark { background: var(--gap-bg); color: var(--gap); }
.rv-q { font-size: 1.12rem; margin-bottom: 8px; }
.rv-opts { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 6px; }
.rv-opts li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 5px 8px; border-radius: 8px; }
.rv-opts .key { width: 26px; height: 26px; font-size: .85rem; border-width: 1.5px; }
.rv-opts li.right { background: var(--solid-bg); }
.rv-opts li.wrong { background: var(--gap-bg); }
.tag { font-size: .78rem; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: var(--card); border: 1.5px solid currentColor; }
.right-tag { color: var(--solid); }
.picked-tag { color: var(--ink-2); }
.rv-sol { font-size: .97rem; margin: 6px 0 0; }
.rv-group { font-weight: 700; margin: 6px 0 0; padding-top: 12px; border-top: 1.5px solid var(--line); }
.rv-right { list-style: none; margin: 6px 0 14px; padding: 0; }
.rv-right li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .97rem; }
.rv-right li:last-child { border-bottom: 0; }
.rv-a { margin-left: 6px; color: var(--solid); }
.nw { white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; border-top: 2px solid var(--line); margin-top: 30px; padding-top: 22px; }
.actions .danger { margin-left: auto; }

/* ---------- modal ---------- */
.modal-wrap {
  position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 10;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal { background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); padding: 24px; max-width: 460px; width: 100%; }
.modal h2 { font-size: 1.3rem; margin-bottom: 10px; }
.modal p { color: var(--ink-2); margin-bottom: 20px; }
.modal.wide { max-width: 620px; }
.modal textarea { display: block; width: 100%; min-height: 220px; margin: 0 0 16px; padding: 12px; font: .92rem/1.5 var(--font); color: var(--ink); background: var(--paper); border: 1.5px solid var(--line-strong); border-radius: 10px; resize: vertical; }
.sync-note { margin: 14px 2px 0; font-size: .93rem; color: var(--ink-2); max-width: 70ch; }

/* ---------- worked solutions ---------- */
.steps { margin: 0; padding-left: 1.7em; display: grid; gap: 9px; }
.steps li { padding-left: 4px; max-width: 66ch; }
.steps li::marker { font-weight: 700; color: var(--ink-2); }
.work-wrap { overflow-x: auto; margin: 2px 0 14px; }
.colwork { border-collapse: collapse; font-size: 1.4rem; line-height: 1.3; font-variant-numeric: tabular-nums; }
.colwork td { min-width: .9em; padding: 1px 3px; text-align: center; }
.colwork td.cw-op { min-width: 1.3em; padding-right: 8px; color: var(--ink-2); }
.colwork .cw-carry td { font-size: .62em; font-weight: 700; color: var(--mark); vertical-align: bottom; height: 1.2em; }

<body>
<main id="app"></main>
<noscript><p style="padding:24px;font:18px system-ui">This check-up needs JavaScript. Please turn it on and reload the page.</p></noscript>
<script>
(function () {
'use strict';
const MINUS = '\u2212', TIMES = '\u00d7', DIVIDE = '\u00f7';
const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }

function round6(x) { return Math.round(x * 1e6) / 1e6; }
function isInt(x) { return Math.abs(x - Math.round(x)) < 1e-9; }
function commas(i) { return i.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function num(x) {

  if (s.indexOf('e') >= 0) s = ax.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  const [i, f] = s.split('.');
  return (neg ? MINUS : '') + commas(i) + (f ? '.' + f : '');
}
function money(x) { const neg = x < 0; const [i, f] = Math.abs(x).toFixed(2).split('.'); return (neg ? MINUS : '') + '$' + commas(i) + '.' + f; }
function dollars(x) { return isInt(x) ? (x < 0 ? MINUS : '') + '$' + num(Math.abs(x)) : money(x); }
function kn(x) { return String(round6(x)); }
function V(n) { return `<i>${n}</i>`; }

// ---------- fractions ----------
function F(n, d) { if (!d) return null; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; }

const fDiv = (a, b) => F(a.n * b.d, a.d * b.n);

  else s = fr(n, d);

}
function mxRaw(w, n, d) { if (!n) return String(w); return w ? `<span class="mx">${w}${fr(n, d)}</span>` : fr(n, d); }

// ---------- options & items ----------
function O(h, k, m) { return { h, k: String(k), m: m || null }; }

function Of(f, m, unit) { return f ? O(fH(f) + (unit ? ' ' + unit : ''), fKey(f), m) : null; }

    opts = o.fixed.map((x, i) => ({ h: x.h, k: x.k != null ? String(x.k) : 'i' + i, m: x.m || null, c: !!x.c }));
    if (!o.noShuffle) opts = R.shuffle(opts);

    let g = 0;
    while (out.length < 4 && o.fill && g++ < 400) {
      const f = o.fill();
      if (validOpt(f) && !keys.has(f.k)) { out.push(f); keys.add(f.k); }

    opts = R.shuffle(out);

  const st = (o.steps || []).filter(Boolean).concat(`Answer: <b>${opts[ans].h}</b>`);
  return { p: o.prompt, f: o.fig || '', o: opts.map(x => ({ h: x.h, k: x.k, m: x.m || null })), ans, sol: o.sol || '', big: !!o.big, st, w: o.work || '' };

// ---------- worked-solution helpers ----------
const PLACES = ['ones', 'tens', 'hundreds', 'thousands', 'ten thousands', 'hundred thousands'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nth = (n, one, many) => n === 1 ? one : many;
// Column arithmetic laid out the way it's written on paper: digits right-aligned, optional carries above.
// Columns holding only commas or decimal points are drawn narrow, so 3,000 reads as one number.
function sepCols(grid) {
  const isSep = c => c === ',' || c === '.';
  return grid[0].map((_, i) => grid.some(g => isSep(g[i])) && grid.every(g => g[i] === '' || isSep(g[i])));
}
function colWork(rows, result, carries) {
  const W = Math.max(result.length, ...rows.map(r => r.s.length));
  const cells = s => Array(W - s.length).fill('').concat(s.split(''));
  const res = cells(result), grid = rows.map(r => cells(r.s)).concat([res]), sep = sepCols(grid);
  const td = (c, i) => `<td${sep[i] ? ' class="cw-sep"' : ''}>${c}</td>`;
  let top = '';
  if (carries) {
    const pl = []; let p = 0;
    for (let i = W - 1; i >= 0; i--) pl[i] = /\d/.test(res[i]) ? p++ : null;
    top = '<tr class="cw-carry"><td></td>' + res.map((_, i) => td(pl[i] != null && carries[pl[i]] ? carries[pl[i]] : '', i)).join('') + '</tr>';
  }
  const tr = (op, arr, cls) => `<tr${cls ? ` class="${cls}"` : ''}><td class="cw-op">${op || ''}</td>${arr.map(td).join('')}</tr>`;
  return `<div class="work-wrap"><table class="colwork" aria-hidden="true">${top}${rows.map((r, k) => tr(r.op, grid[k], r.rule ? 'cw-rule' : '')).join('')}${tr('', res, 'cw-res')}</table></div>`;

// Numbers stacked with their digits lined up (for comparing decimals).
function stackWork(strs) {

  return `<div class="work-wrap"><table class="colwork" aria-hidden="true">${grid.map(g => `<tr><td class="cw-op"></td>${g.map((c, i) => `<td${sep[i] ? ' class="cw-sep"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

// Long division, one quotient digit at a time, with the written layout (divisor, bracket, subtractions).
function longDiv(n, d) {
  const ds = String(n).split('').map(Number), steps = [], L = ds.length, qrow = Array(L).fill(''), rows = [];

  for (let i = 0; i < ds.length; i++) {
    cur = cur * 10 + ds[i];

    let s = !started && i > 0 ? `${d} is bigger than ${String(n).slice(0, i)}, so start with ${cur}. ` : '';
    started = true;
    const qd = Math.floor(cur / d), prod = qd * d, rem = cur - prod;
    s += qd === 0 ? `How many ${d}s are in ${cur}? None, so write 0 in the answer.`
      : `How many ${d}s are in ${cur}? ${qd}, because ${qd} ${TIMES} ${d} = ${prod}${d >= 10 ? ` (${qd + 1} ${TIMES} ${d} = ${(qd + 1) * d} is too much)` : ''}. Write ${qd}. Subtract: ${cur} ${MINUS} ${prod} = ${rem}.`;
    if (i < ds.length - 1) s += ` Bring down the ${ds[i + 1]} to make ${rem * 10 + ds[i + 1]}.`;
    steps.push(s); q += qd; cur = rem;

    const ps = String(prod), pFrom = i - ps.length + 1, ruleFrom = Math.min(pFrom, from), prow = Array(L).fill('');
    ps.split('').forEach((c, k) => { prow[pFrom + k] = c; });

    const rs = String(rem), rFrom = i - rs.length + 1, rrow = Array(L).fill('');
    rs.split('').forEach((c, k) => { rrow[rFrom + k] = c; });

    + `<tr><td class="ld-d">${d}</td><td class="cw-op ld-brk"></td>${ds.map(c => `<td class="ld-top">${c}</td>`).join('')}${extra}</tr>`;
  for (const r of rows) {
    h += `<tr><td></td><td class="cw-op">${r.minus === -1 ? MINUS : ''}</td>` + r.cells.map((c, k) => {

// A place-value chart with one digit highlighted.
function placeChart(str, hi) {

// ---------- figures (SVG) ----------
function svgOpen(W, H, label) { const w = Math.round(W), h = Math.round(H); return `<svg class="fig" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${label}">`; }

function svgFracLine(d, wholes, k) {

function svgNumLine(min, max, pts, half, step = 1) {

  }
  for (const p of pts) s += `<circle class="pt" cx="${X(p.v)}" cy="${y}" r="6.5"/><text class="lb" x="${X(p.v)}" y="${y - 17}" text-anchor="middle">${p.label}</text>`;

}
function svgIneq(b, sym) {
  const min = b - 5, max = b + 5, W = 460, H = 90, x0 = 26, x1 = 434, y = 44, st = (x1 - x0) / (max - min), X = v => x0 + (v - min) * st;
  let s = svgOpen(W, H, 'Inequality graph') + `<line class="ax" x1="${x0 - 16}" y1="${y}" x2="${x1 + 16}" y2="${y}"/>` + arrows(x0 - 16, x1 + 16, y);
  for (let v = min; v <= max; v++) s += `<line class="tk" x1="${X(v)}" y1="${y - 9}" x2="${X(v)}" y2="${y + 9}"/><text class="sm" x="${X(v)}" y="${y + 30}" text-anchor="middle">${num(v)}</text>`;
  const right = sym === 'gt' || sym === 'ge', closed = sym === 'ge' || sym === 'le', xe = right ? x1 + 8 : x0 - 8;
  s += `<line class="ray" x1="${X(b)}" y1="${y}" x2="${xe}" y2="${y}"/>`;
  s += right ? `<path class="rayh" d="M${xe + 10} ${y}L${xe - 4} ${y - 9}L${xe - 4} ${y + 9}Z"/>` : `<path class="rayh" d="M${xe - 10} ${y}L${xe + 4} ${y - 9}L${xe + 4} ${y + 9}Z"/>`;

}
function svgGrid(px, py) {
  const n = 6, W = 340, c = W / 2, st = (W - 44) / (2 * n), X = v => c + v * st, Y = v => c - v * st;
  let s = svgOpen(W, W, 'Coordinate grid');

const G = {};

  let a = R.int(3, 9), b = R.int(3, 9);

  const steps = big >= 6
    ? [`Break the ${big} into 5 and ${big - 5}. Fives are easy.`, `5 ${TIMES} ${small} = ${5 * small}.`, `${big - 5} ${TIMES} ${small} = ${(big - 5) * small}.`, `Add the two parts: ${5 * small} + ${(big - 5) * small} = ${c}.`]
    : [`${a} ${TIMES} ${b} means ${a} groups of ${b}.`, `Count by ${b}s, ${a} times: ${Array.from({ length: a }, (_, i) => b * (i + 1)).join(', ')}.`];
  return makeItem({
    big: true, prompt: `${a} ${TIMES} ${b} = ?`, correct: On(c),
    ds: near.filter(x => x > 0).map(x => On(x)),
    fill: nearFill(c, [-4, -3, -2, 2, 3, 4]),

};

    steps.push(`${cap(PLACES[p])}: ${parts.join(' + ')} = ${s}.` + (s >= 10 && !last ? ` Write ${s % 10} and carry 1 to the ${PLACES[p + 1]}.` : ` Write ${s}.`));

  for (let i = 0; i < top.length; i++) {
    const bd = B[i] || 0, name = cap(PLACES[i]);
    if (top[i] >= bd) { steps.push(`${name}: ${top[i]} ${MINUS} ${bd} = ${top[i] - bd}.`); continue; }
    let j = i + 1; while (top[j] === 0) j++;
    const zerosBetween = j - i - 1;
    const how = zerosBetween === 0
      ? `take 1 from the ${PLACES[j]} (${top[j]} becomes ${top[j] - 1})`
      : `the ${PLACES.slice(i + 1, j).join(' and ')} ${nth(zerosBetween, 'is', 'are')} 0, so go to the ${PLACES[j]}: ${top[j]} becomes ${top[j] - 1}, and each 0 in between becomes 9`;
    steps.push(`${name}: ${top[i]} is less than ${bd}, so regroup: ${how}. The ${top[i]} in the ${PLACES[i]} becomes ${top[i] + 10}, and ${top[i] + 10} ${MINUS} ${bd} = ${top[i] + 10 - bd}.`);
    top[j] -= 1; for (let k = i + 1; k < j; k++) top[k] = 9; top[i] += 10;
  }
  return steps;
}

G.oop = () => {
  const t = R.int(1, 4); let prompt, c, steps; const ds = [];
  if (t === 1) {
    const b = R.int(2, 6), cc = R.int(2, 6), a = R.int(b * cc + 1, b * cc + 20), d = R.int(2, 9);
    prompt = `${a} ${MINUS} ${b} ${TIMES} ${cc} + ${d}`; c = a - b * cc + d;
    steps = [`No parentheses or exponents, so multiply first: ${b} ${TIMES} ${cc} = ${b * cc}.`, `Now it is ${a} ${MINUS} ${b * cc} + ${d}. Go left to right: ${a} ${MINUS} ${b * cc} = ${a - b * cc}.`, `Then ${a - b * cc} + ${d} = ${c}.`];
    ds.push(On((a - b) * cc + d, 'oop_left_to_right'));
    if (a - (b * cc + d) >= 0) ds.push(On(a - (b * cc + d), 'oop_add_before_sub'));
  } else if (t === 2) {
    const a = R.int(2, 12), b = R.int(2, 6), d = R.int(1, 6), cc = R.int(d + 2, d + 7);
    prompt = `${a} + ${b} ${TIMES} (${cc} ${MINUS} ${d})`; c = a + b * (cc - d);
    steps = [`Parentheses first: ${cc} ${MINUS} ${d} = ${cc - d}.`, `Now it is ${a} + ${b} ${TIMES} ${cc - d}. Multiply before adding: ${b} ${TIMES} ${cc - d} = ${b * (cc - d)}.`, `Then add: ${a} + ${b * (cc - d)} = ${c}.`];
    ds.push(On((a + b) * (cc - d), 'oop_left_to_right'));
    if (a + b * cc - d > 0) ds.push(On(a + b * cc - d, 'oop_ignore_parens'));
  } else if (t === 3) {
    const cc = R.int(2, 5), d = R.int(2, 6), m = R.chance(0.6) ? d * R.int(1, 3) : R.int(2, 9), S = cc * m, a = R.int(1, S - 1), b = S - a;
    prompt = `(${a} + ${b}) ${DIVIDE} ${cc} ${TIMES} ${d}`; c = m * d;
    steps = [`Parentheses first: ${a} + ${b} = ${S}.`, `Now it is ${S} ${DIVIDE} ${cc} ${TIMES} ${d}. Multiply and divide are done left to right, so divide first: ${S} ${DIVIDE} ${cc} = ${m}.`, `Then ${m} ${TIMES} ${d} = ${c}.`];
    if (m % d === 0) ds.push(On(m / d, 'oop_mult_before_div'));
    if (b % cc === 0) ds.push(On(a + b / cc * d, 'oop_ignore_parens'));
  } else {
    const a = R.int(3, 9), b = R.int(3, 9), d = R.int(2, 5), cc = d * R.int(2, 6);
    prompt = `${a} ${TIMES} ${b} ${MINUS} ${cc} ${DIVIDE} ${d}`; c = a * b - cc / d;
    steps = [`Multiply and divide before subtracting.`, `${a} ${TIMES} ${b} = ${a * b}.`, `${cc} ${DIVIDE} ${d} = ${cc / d}.`, `Now subtract: ${a * b} ${MINUS} ${cc / d} = ${c}.`];
    if (a * b > cc && (a * b - cc) % d === 0) ds.push(On((a * b - cc) / d, 'oop_left_to_right'));
    if (b > cc && (a * (b - cc)) % d === 0) ds.push(On(a * (b - cc) / d, 'oop_add_first'));
  }
  ds.push(On(c + 2));
  return makeItem({
    prompt: prompt + ' = ?', correct: On(c), ds, fill: nearFill(c, [-1, 1, -2, 3, 10, -10], null, 0),
    sol: steps.join(' '),
    steps: ['Order: parentheses, then exponents, then × and ÷ left to right, then + and − left to right.', ...steps],
  });
};

// ===== Section B: Fractions =====
const OF = (n, d, m) => O(fr(n, d), fKey(F(n, d)), m); // raw-looking fraction, keyed by value
const multiplesTo = (b, L) => Array.from({ length: L / b }, (_, i) => b * (i + 1)).join(', ');
// Turning an improper fraction into a mixed number, as a step.
const toMixedStep = (n, d) => n > d && n % d !== 0 ? `${fr(n, d)} is more than 1 whole: ${n} ${DIVIDE} ${d} = ${Math.floor(n / d)} R ${n % d}, so ${fr(n, d)} = ${mxRaw(Math.floor(n / d), n % d, d)}.` : null;
// Finding a common denominator and rewriting both fractions, as steps.
function commonDenSteps(a, b, c, d) {
  const L = lcm(b, d), rw = (x, y) => y === L ? `${fr(x, y)} already has ${L} on the bottom.` : `${fr(x, y)} = ${fr(x * L / y, L)} (multiply the top and bottom by ${L / y}).`;
  return [
    `The bottoms are different (${b} and ${d}), so find a common denominator: the smallest number both go into.`,
    `Count by ${b}s: ${multiplesTo(b, L)}. Count by ${d}s: ${multiplesTo(d, L)}. Both reach ${L}.`,
    `Rewrite each fraction with ${L} on the bottom: ${rw(a, b)}`, rw(c, d),
  ];
}

G.equivfrac = () => {
  if (R.chance(0.5)) {
    let n, d; do { d = R.int(2, 6); n = R.int(1, d - 1); } while (gcd(n, d) !== 1);
    const k = R.int(2, 5), N = n * k, D = d * k;
    return makeItem({
      prompt: `Which fraction is equal to ${fr(n, d)}?`, correct: OF(N, D),
      ds: [OF(n + D - d, D, 'frac_equiv_add'), OF(n, D, 'frac_equiv_one_part'), OF(N + 1, D)],
      fill: () => { const dd = R.pick([D, D, D + 1, D - 1, d * (k + 1)]); return OF(R.int(1, dd - 1), dd); },
      sol: `Multiply the top and bottom by ${k}: ${fr(n, d)} = ${fr(N, D)}.`,
      steps: [
        'An equal fraction comes from multiplying the top and the bottom by the same number. Adding the same number does not work.',
        `Try a bottom of ${D}: ${d} ${TIMES} ${k} = ${D}, so the number is ${k}.`,
        `Multiply the top by ${k} too: ${n} ${TIMES} ${k} = ${N}.`,
        `So ${fr(n, d)} = ${fr(N, D)}.`,
      ],
    });
  }
  let n, d; do { d = R.int(3, 8); n = R.int(1, d - 1); } while (gcd(n, d) !== 1);

  const raw = (a, b, m) => O(fr(a, b), `r${a}/${b}`, m);
  const sub = D - (N - n);
  return makeItem({
    prompt: `Which shows ${fr(N, D)} in <b>simplest form</b>?`, correct: raw(n, d),
    ds: [raw(N / p, D / p, 'frac_not_simplest'), sub > n ? raw(n, sub, 'frac_equiv_add') : null, raw(n, d + 1)],
    fill: () => { const j = R.int(1, d + 2), m = R.int(j + 1, d + 4); return gcd(j, m) === 1 && j * d !== n * m ? raw(j, m) : null; },
    sol: `Divide the top and bottom by ${k}, the greatest common factor: ${fr(N, D)} = ${fr(n, d)}.`,
    steps: [
      `Find the biggest number that divides both ${N} and ${D}. It is ${k}.`,
      `Divide the top and the bottom by ${k}: ${N} ${DIVIDE} ${k} = ${n} and ${D} ${DIVIDE} ${k} = ${d}.`,
      `Check: no number bigger than 1 divides both ${n} and ${d}, so ${fr(n, d)} is in simplest form.`,

G.comparefrac = () => {
  if (R.chance(0.4)) {
    const a = R.int(1, 5), dens = R.shuffle(Array.from({ length: 12 - a }, (_, i) => a + 1 + i)).slice(0, 4);
    const mn = Math.min(...dens), mxd = Math.max(...dens);
    return makeItem({
      prompt: 'Which fraction is the <b>greatest</b>?',
      fixed: dens.map(dd => ({ h: fr(a, dd), k: dd, m: dd === mxd ? 'frac_bigger_denominator' : null, c: dd === mn })),
      sol: `All have ${a} on top, so the one with the smallest bottom number (the biggest pieces) is greatest: ${fr(a, mn)}.`,
      steps: [
        `All four fractions have ${a} on top, so each one is ${a} ${nth(a, 'piece', 'pieces')}.`,
        `The bottom number says how many pieces the whole is cut into. More pieces means smaller pieces: ${fr(1, mn)} is bigger than ${fr(1, mxd)}.`,
        `The smallest bottom number, ${mn}, gives the biggest pieces, so ${fr(a, mn)} is the greatest.`,
      ],
    });
  }
  for (let t = 0; t < 2000; t++) {
    const d = R.int(3, 8), n = R.int(1, d - 1), C = n / d;
    if (C < 0.6 || C > 0.9 || gcd(n, d) !== 1) continue;
    const Ad = R.int(10, 12), An = R.int(1, Math.floor((C - 0.08) * Ad));
    const Bn = R.int(Math.max(n, An) + 1, Math.max(n, An) + 4), Bmin = Math.ceil(Bn / (C - 0.06));
    if (Bmin >= Ad) continue;
    const Bd = R.int(Bmin, Ad - 1); if (Bd <= Bn) continue;
    const Dd = R.int(3, 9), Dn = R.int(1, Dd - 1), Dv = Dn / Dd;
    if (!(Dv < C - 0.04 && Dv > C - 0.35) || Dn >= Bn) continue;
    if (new Set([C, An / Ad, Bn / Bd, Dv].map(v => v.toFixed(6))).size < 4) continue;
    const half = (x, y) => x * 2 > y ? 'more than half' : x * 2 < y ? 'less than half' : 'exactly half';
    return makeItem({
      prompt: 'Which fraction is the <b>greatest</b>?',
      fixed: [{ h: fr(n, d), c: true }, { h: fr(An, Ad), m: 'frac_bigger_denominator' }, { h: fr(Bn, Bd), m: 'frac_bigger_numerator' }, { h: fr(Dn, Dd) }],
      sol: `${fr(n, d)} is about ${C.toFixed(2)}. The others are smaller: ${fr(An, Ad)} ≈ ${(An / Ad).toFixed(2)}, ${fr(Bn, Bd)} ≈ ${(Bn / Bd).toFixed(2)}, ${fr(Dn, Dd)} ≈ ${Dv.toFixed(2)}.`,
      steps: [
        'Bigger numbers on top or bottom don’t make a fraction bigger. Compare how much of a whole each one is.',
        `Quick check against one half: ${[[n, d], [An, Ad], [Bn, Bd], [Dn, Dd]].map(([x, y]) => `${fr(x, y)} is ${half(x, y)}`).join('; ')}.`,
        `To be exact, divide top by bottom: ${fr(n, d)} ≈ ${C.toFixed(2)}, ${fr(An, Ad)} ≈ ${(An / Ad).toFixed(2)}, ${fr(Bn, Bd)} ≈ ${(Bn / Bd).toFixed(2)}, ${fr(Dn, Dd)} ≈ ${Dv.toFixed(2)}.`,
        `The biggest is ${fr(n, d)}.`,
      ],
    });
  }
  return G.comparefrac();
};

G.fraclike = () => {
  if (R.chance(0.5)) {
    let d, a, b; do { d = R.int(5, 12); a = R.int(1, d - 2); b = R.int(1, d - 2); } while (a + b >= d || gcd(a + b, d) !== 1);
    const s = a + b;
    return makeItem({
      prompt: `${fr(a, d)} + ${fr(b, d)} = ?`, correct: OF(s, d),
      ds: [OF(s, 2 * d, 'frac_across'), a !== b ? OF(Math.abs(a - b), d, 'wrong_operation') : null, s + 1 < d ? OF(s + 1, d) : null],
      fill: () => OF(R.int(1, d - 1), d),
      sol: `The pieces are the same size (${d}ths), so add only the tops: ${a} + ${b} = ${s}. The answer is ${fr(s, d)}.`,
      steps: [
        `Both fractions have ${d} on the bottom, so the pieces are the same size.`,
        `Add the tops (how many pieces): ${a} + ${b} = ${s}.`,
        `Keep the bottom (the size of each piece) the same: ${fr(s, d)}. Adding the bottoms would change the piece size, which is wrong.`,
      ],
    });
  }
  let W1, W2, n1, n2, d;
  do { d = R.int(3, 8); W1 = R.int(3, 9); W2 = R.int(1, W1 - 1); n1 = R.int(1, d - 2); n2 = R.int(n1 + 1, d - 1); } while (gcd(d + n1 - n2, d) !== 1);
  const tot = F(W1 * d + n1 - (W2 * d + n2), d), wl = W1 - 1 - W2, fp = d + n1 - n2;
  return makeItem({
    prompt: `${mxRaw(W1, n1, d)} ${MINUS} ${mxRaw(W2, n2, d)} = ?`, correct: Of(tot),
    ds: [Of(F((W1 - W2) * d + n2 - n1, d), 'frac_mixed_flip'), Of(F((W1 - 1 - W2) * d + n1 + 10 - n2, d), 'frac_borrow_ten'), Of(fAdd(tot, F(1, 1)))],
    fill: () => Of(fAdd(tot, F(R.pick([-1, 1, 2]), d))),
    sol: `${fr(n1, d)} is less than ${fr(n2, d)}, so regroup: ${mxRaw(W1, n1, d)} = ${mxRaw(W1 - 1, d + n1, d)}. Then ${mxRaw(W1 - 1, d + n1, d)} ${MINUS} ${mxRaw(W2, n2, d)} = ${fH(tot)}.`,
    steps: [
      `Look at the fraction parts: ${fr(n1, d)} is less than ${fr(n2, d)}, so you can’t take ${fr(n2, d)} away yet.`,
      `Regroup: take 1 whole from the ${W1} and turn it into ${fr(d, d)}. That leaves ${W1 - 1} wholes and ${fr(d, d)} + ${fr(n1, d)} = ${fr(d + n1, d)}, so ${mxRaw(W1, n1, d)} = ${mxRaw(W1 - 1, d + n1, d)}.`,
      `Subtract the fractions: ${fr(d + n1, d)} ${MINUS} ${fr(n2, d)} = ${fr(fp, d)}.`,
      `Subtract the whole numbers: ${W1 - 1} ${MINUS} ${W2} = ${wl}.`,
      `Put them together: ${mxRaw(wl, fp, d)}.`,
    ],
  });
};

const UNLIKE = [[2, 3], [2, 5], [3, 4], [3, 5], [4, 6], [3, 8], [4, 5], [5, 6], [6, 8], [2, 9], [4, 10], [3, 6], [4, 8], [2, 8], [3, 10]];
G.fracunlike = () => {
  let [b, d] = R.pick(UNLIKE); if (R.chance(0.5)) [b, d] = [d, b];
  const L = lcm(b, d), mode = R.chance(0.2) ? 'mixed' : R.chance(0.65) ? 'add' : 'sub';
  // For add/sub, keep the common-denominator result already in simplest form so the item tests adding, not simplifying.
  let a, c, S, t = 0;
  do {
    a = R.int(1, b - 1); c = R.int(1, d - 1);
    S = mode === 'sub' ? a * L / b - c * L / d : a * L / b + c * L / d;
  } while ((gcd(a, b) !== 1 || gcd(c, d) !== 1 || (mode === 'sub' && S <= 0) || (mode !== 'mixed' && gcd(S, L) !== 1)) && ++t < 500);
  if (t >= 500) return G.fracunlike();
  const A = F(a, b), C = F(c, d), near = x => { const y = fAdd(x, F(R.pick([1, -1, 2]), L)); return y.n > 0 ? Of(y) : null; };
  const conv = (s) => `Use ${L} as the common denominator: ${fr(a * L / b, L)} ${s} ${fr(c * L / d, L)}`;
  const cd = commonDenSteps(a, b, c, d), A2 = a * L / b, C2 = c * L / d;
  if (mode === 'add') {
    const ans = fAdd(A, C);
    return makeItem({
      prompt: `${fr(a, b)} + ${fr(c, d)} = ?`, correct: Of(ans),
      ds: [OF(a + c, b + d, 'frac_across'), OF(a + c, L, 'frac_unconverted'), near(ans)], fill: () => near(ans),
      sol: `${conv('+')} = ${fr(a * L / b + c * L / d, L)}${ans.d !== L || ans.n > ans.d ? ' = ' + fH(ans) : ''}.`,
      steps: [...cd, `Now the pieces are the same size. Add the tops: ${A2} + ${C2} = ${S}. Keep the bottom: ${fr(S, L)}.`, toMixedStep(S, L)],
    });
  }
  if (mode === 'sub') {
    const ans = fSub(A, C);
    return makeItem({
      prompt: `${fr(a, b)} ${MINUS} ${fr(c, d)} = ?`, correct: Of(ans),
      ds: [a > c && b - d >= 2 && a - c < b - d ? OF(a - c, b - d, 'frac_across') : null, a > c ? OF(a - c, L, 'frac_unconverted') : null, near(ans), Of(fAdd(A, C))],
      fill: () => Of(F(R.int(1, L - 1), L)),
      sol: `${conv(MINUS)} = ${fr(a * L / b - c * L / d, L)}${ans.d !== L ? ' = ' + fH(ans) : ''}.`,
      steps: [...cd, `Now the pieces are the same size. Subtract the tops: ${A2} ${MINUS} ${C2} = ${S}. Keep the bottom: ${fr(S, L)}.`],
    });
  }
  const W1 = R.int(1, 4), W2 = R.int(1, 3), ans = fAdd(F(W1 + W2, 1), fAdd(A, C)), fs = fAdd(A, C), SL = A2 + C2;
  return makeItem({
    prompt: `${mxRaw(W1, a, b)} + ${mxRaw(W2, c, d)} = ?`, correct: Of(ans),
    ds: [O(mxRaw(W1 + W2, a + c, b + d), fKey(F((W1 + W2) * (b + d) + a + c, b + d)), 'frac_across'), fv(fs) > 1 ? Of(fSub(ans, F(1, 1)), 'frac_mixed_carry') : null, Of(fAdd(ans, F(1, 1)))],
    fill: () => near(ans),
    sol: `Add the wholes: ${W1} + ${W2} = ${W1 + W2}. Add the fractions: ${conv('+')} = ${fH(fs)}. Total: ${fH(ans)}.`,
    steps: [
      `Add the whole numbers: ${W1} + ${W2} = ${W1 + W2}.`,
      ...cd,
      `Add the fractions: ${fr(A2, L)} + ${fr(C2, L)} = ${fr(SL, L)}${fs.n !== SL || fs.d !== L ? ` = ${fH(fs, false)}` : ''}.`,
      fv(fs) > 1 ? `${fH(fs, false)} is more than 1 whole: it is ${fH(fs)}. Add that extra 1 to the ${W1 + W2}.` : null,
      `Put them together: ${fH(ans)}.`,
    ],
  });
};

G.fracmult = () => {
  if (R.chance(0.45)) {
    let w, n, d; do { w = R.int(2, 6); d = R.int(3, 8); n = R.int(1, d - 1); } while (gcd(n, d) !== 1 || gcd(w * n, d) !== 1);
    const ans = F(w * n, d);
    return makeItem({
      prompt: `${w} ${TIMES} ${fr(n, d)} = ?`, correct: Of(ans),
      ds: [OF(w * n, w * d, 'frac_mult_both'), O(mxRaw(w, n, d), fKey(F(w * d + n, d)), 'frac_whole_mixed'), OF(n, w * d, 'frac_mult_denominator')],
      fill: () => Of(fAdd(ans, F(R.pick([1, -1]), d))),
      sol: `Multiply the top by ${w}: ${w} ${TIMES} ${fr(n, d)} = ${fr(w * n, d)}${w * n > d ? ' = ' + fH(ans) : ''}.`,
      steps: [
        `Write ${w} as a fraction: ${fr(w, 1)}.`,
        `Multiply the tops: ${w} ${TIMES} ${n} = ${w * n}. Multiply the bottoms: 1 ${TIMES} ${d} = ${d}.`,
        `That gives ${fr(w * n, d)}. (It is ${w} groups of ${fr(n, d)}, so only the number of pieces changes, not their size.)`,
        toMixedStep(w * n, d),
      ],
    });
  }
  let a, b, c, d; do { b = R.int(2, 9); d = R.int(2, 9); a = R.int(1, b - 1); c = R.int(1, d - 1); } while (gcd(a, b) !== 1 || gcd(c, d) !== 1 || gcd(a * c, b * d) !== 1);
  const L = lcm(b, d), ans = F(a * c, b * d);
  return makeItem({
    prompt: `${fr(a, b)} ${TIMES} ${fr(c, d)} = ?`, correct: Of(ans),
    ds: [Of(F(a * d, b * c), 'frac_cross_multiply'), L > 1 ? Of(F((a * L / b) * (c * L / d), L), 'frac_mult_common_denom') : null, Of(F(a * c + 1, b * d))],
    fill: () => Of(F(a * c + R.int(2, 4), b * d)),
    sol: `Multiply straight across: ${a} ${TIMES} ${c} = ${a * c} on top, ${b} ${TIMES} ${d} = ${b * d} on the bottom. The answer is ${fr(a * c, b * d)}.`,
    steps: [
      'To multiply fractions, multiply straight across. No common denominator is needed.',
      `Tops: ${a} ${TIMES} ${c} = ${a * c}.`,
      `Bottoms: ${b} ${TIMES} ${d} = ${b * d}.`,
      `${fr(a * c, b * d)} can’t be simplified, so that is the answer.`,
    ],
  });
};

G.fracdiv = () => {
  const t = R.pick(['uw', 'wu', 'ff', 'ff', 'story']);
  if (t === 'uw') {
    const u = R.int(2, 6), w = R.int(2, 6);
    return makeItem({
      prompt: `${fr(1, u)} ${DIVIDE} ${w} = ?`, correct: Of(F(1, u * w)),
      ds: [Of(F(w, u), 'frac_div_as_mult'), Of(F(u * w, 1), 'div_order_reversed'), Of(F(u, w), 'frac_div_flip_first')],
      fill: () => Of(F(1, u + w + R.int(0, 3))),
      sol: `Splitting ${fr(1, u)} into ${w} equal parts gives ${fr(1, u * w)} (same as ${fr(1, u)} ${TIMES} ${fr(1, w)}).`,
      steps: [
        `Dividing by ${w} means splitting into ${w} equal parts, which is the same as multiplying by ${fr(1, w)}.`,
        `${fr(1, u)} ${TIMES} ${fr(1, w)}: tops 1 ${TIMES} 1 = 1, bottoms ${u} ${TIMES} ${w} = ${u * w}.`,
        `Picture it: cut ${fr(1, u)} of a pizza into ${w} equal slices. Each slice is ${fr(1, u * w)} of the whole pizza.`,
      ],
    });
  }
  if (t === 'wu') {
    const u = R.int(2, 6), w = R.int(2, 6);
    return makeItem({
      prompt: `${w} ${DIVIDE} ${fr(1, u)} = ?`, correct: Of(F(w * u, 1)),
      ds: [Of(F(w, u), 'frac_div_as_mult'), Of(F(1, w * u), 'div_order_reversed'), Of(F(w + u, 1))],
      fill: () => Of(F(w * u + R.pick([-2, 2, u]), 1)),
      sol: `How many ${fr(1, u)}s fit in ${w}? Each whole holds ${u}, so ${w} ${TIMES} ${u} = ${w * u}.`,
      steps: [
        `Ask: how many pieces of size ${fr(1, u)} fit into ${w}?`,
        `One whole holds ${u} of them.`,
        `${w} wholes hold ${w} ${TIMES} ${u} = ${w * u}. (Dividing by a fraction less than 1 gives a bigger number.)`,
      ],
    });
  }
  if (t === 'ff') {
    let a, b, c, d, ans; do { b = R.int(2, 8); d = R.int(2, 8); a = R.int(1, b - 1); c = R.int(1, d - 1); ans = F(a * d, b * c); } while (gcd(a, b) !== 1 || gcd(c, d) !== 1 || ans.n === ans.d || b === d);
    const g = gcd(a * d, b * c);
    return makeItem({
      prompt: `${fr(a, b)} ${DIVIDE} ${fr(c, d)} = ?`, correct: Of(ans),
      ds: [Of(F(a * c, b * d), 'frac_div_no_flip'), Of(F(b * c, a * d), 'frac_div_flip_first'), Of(fAdd(ans, F(1, ans.d)))],
      fill: () => Of(fAdd(ans, F(R.pick([1, 2, -1]), ans.d * 2))),
      sol: `Keep ${fr(a, b)}, change ${DIVIDE} to ${TIMES}, flip ${fr(c, d)} to ${fr(d, c)}: ${fr(a, b)} ${TIMES} ${fr(d, c)} = ${fr(a * d, b * c)}${ans.d !== b * c ? ' = ' + fH(ans) : ''}.`,
      steps: [
        `Keep the first fraction: ${fr(a, b)}.`,
        `Change ${DIVIDE} to ${TIMES}.`,
        `Flip the second fraction: ${fr(c, d)} becomes ${fr(d, c)}. (Only the second one flips.)`,
        `Multiply straight across: ${fr(a, b)} ${TIMES} ${fr(d, c)} = ${fr(a * d, b * c)}.`,
        g > 1 ? `Simplify: divide the top and bottom by ${g} to get ${fr(a * d / g, b * c / g)}.` : null,
        toMixedStep(ans.n, ans.d),
      ],
    });
  }
  let T, n, d; do { d = R.int(2, 6); n = R.int(1, d - 1); T = R.int(2, 9); } while (gcd(n, d) !== 1 || (T * d) % n !== 0 || n === d);
  const ans = T * d / n, s = fr(n, d);
  const prompt = R.pick([
    `How many ${s}-cup servings are in ${T} cups of yogurt?`,
    `A ribbon is ${T} feet long. How many pieces that are each ${s} foot long can be cut from it?`,
    `A path is ${T} miles long. There is a water stop every ${s} mile. How many ${s}-mile sections is the path split into?`,
  ]);
  return makeItem({
    prompt, correct: Of(F(ans, 1)),
    ds: [Of(F(T * n, d), 'frac_div_as_mult'), Of(F(n, d * T), 'div_order_reversed'), Of(F(ans + 1, 1))],
    fill: () => Of(F(ans + R.pick([2, -1, -2]), 1)),
    sol: `${T} ${DIVIDE} ${s} = ${T} ${TIMES} ${fr(d, n)} = ${ans}.`,
    steps: [
      `“How many ${s}s fit in ${T}?” is a division question: ${T} ${DIVIDE} ${s}.`,
      `Keep ${T}, change ${DIVIDE} to ${TIMES}, flip ${s} to ${fr(d, n)}.`,
      n === 1 ? `${T} ${TIMES} ${fr(d, 1)} = ${T} ${TIMES} ${d} = ${ans}.` : `${T} ${TIMES} ${fr(d, n)} = ${fr(T * d, n)} = ${T * d} ${DIVIDE} ${n} = ${ans}.`,
      n === 1 ? `Check: each whole has ${d} of them, and ${T} ${TIMES} ${d} = ${ans}.` : `Check: ${ans} pieces ${TIMES} ${s} = ${fr(ans * n, d)} = ${T}.`,
    ],
  });
};

// ===== Section C: Decimals & place value =====
const DEC_PLACES = ['tenths', 'hundredths', 'thousandths'];
G.placevalue = () => {
  if (R.chance(0.5)) {
    const len = R.int(5, 6), p = R.int(2, len - 1), t = R.int(1, 9);
    const ds = Array.from({ length: len }, (_, i) => { let x; do { x = i === 0 ? R.int(1, 9) : R.int(0, 9); } while (x === t); return x; });
    ds[len - 1 - p] = t;
    const n = Number(ds.join('')), v = t * Math.pow(10, p);
    return makeItem({
      prompt: `What is the value of the digit <b>${t}</b> in ${num(n)}?`, correct: On(v),
      ds: [On(v / 10, 'pv_off_by_one'), On(v * 10, 'pv_off_by_one'), On(t, 'pv_face_value')],
      fill: () => null,
      sol: `The ${t} is in the ${['ones', 'tens', 'hundreds', 'thousands', 'ten-thousands', 'hundred-thousands'][p]} place, so it is worth ${num(v)}.`,
      work: placeChart(String(n), len - 1 - p),
      steps: [
        'Name the places from the right: ones, tens, hundreds, thousands, ten thousands, hundred thousands.',
        `The ${t} is in the ${PLACES[p]} place.`,
        `So it is worth ${t} ${TIMES} ${num(10 ** p)} = ${num(v)}, not just ${t}.`,
      ],
    });
  }
  const t = R.int(1, 9), nd = R.int(2, 3), q = R.int(1, nd);
  const pickD = (first) => { let x; do { x = first ? R.int(1, 9) : R.int(0, 9); } while (x === t); return x; };
  const whole = Array.from({ length: R.int(1, 3) }, (_, i) => pickD(i === 0));
  const dec = Array.from({ length: nd }, (_, i) => i === nd - 1 ? pickD(true) : pickD(false));
  dec[q - 1] = t;
  const n = Number(whole.join('') + '.' + dec.join('')), v = t / Math.pow(10, q);
  return makeItem({
    prompt: `What is the value of the digit <b>${t}</b> in ${num(n)}?`, correct: On(v),
    ds: [On(t * Math.pow(10, q), 'pv_decimal_whole'), On(v / 10, 'pv_off_by_one'), On(t, 'pv_face_value'), On(v * 10, 'pv_off_by_one')],
    fill: () => null,
    sol: `The ${t} is in the ${DEC_PLACES[q - 1]} place, so it is worth ${num(v)}.`,
    work: placeChart(whole.join('') + '.' + dec.join(''), whole.length + q),
    steps: [
      'After the decimal point, the places are tenths, hundredths, thousandths. (Tenths, not tens: they are smaller than 1.)',
      `The ${t} is ${q} ${nth(q, 'place', 'places')} after the decimal point, in the ${DEC_PLACES[q - 1]} place.`,
      `So it is worth ${t} ${t === 1 ? DEC_PLACES[q - 1].slice(0, -1) : DEC_PLACES[q - 1]} = ${fr(t, 10 ** q)} = ${num(v)}.`,
    ],
  });
};

G.comparedec = () => {
  const W = R.chance(0.5) ? 0 : R.int(1, 9), a = R.int(3, 8), b1 = R.int(1, 9), c1 = R.int(1, 9);
  let b2; do { b2 = R.int(1, 9); } while (b2 === b1);
  const dd = R.int(a + 1, 9);
  const corr = W + a / 10, A = W + (a - 1) / 10 + b1 / 100 + c1 / 1000, B = W + (a - 1) / 10 + b2 / 100, C = W + dd / 100;
  const three = x => x.toFixed(3);
  return makeItem({
    prompt: 'Which number is the <b>greatest</b>?',
    fixed: [{ h: num(corr), c: true }, { h: num(A), m: 'dec_longer_bigger' }, { h: num(B), m: 'dec_longer_bigger' }, { h: num(C), m: 'dec_ignore_zero' }],
    sol: `Line up the decimal points and compare tenths first: ${num(corr)} has ${a} tenths, more than any of the others.`,
    work: stackWork([corr, A, B, C].map(three)),
    steps: [
      'Line up the decimal points. Add zeros at the end so every number has the same number of digits. Adding zeros at the end doesn’t change the value.',
      `The whole-number parts are all ${W}, so compare the tenths (the first digit after the point): ${a}, ${a - 1}, ${a - 1} and 0.`,
      `${num(corr)} has the most tenths, so it is the greatest, even though it has fewer digits.`,
    ],
  });
};

G.fracdec = () => {
  if (R.chance(0.5)) {
    const single = R.chance(0.6);
    let n; do { n = single ? R.int(1, 9) : R.int(11, 99); } while (n % 10 === 0);
    return makeItem({
      prompt: `Which decimal is equal to ${fr(n, 100)}?`, correct: On(n / 100),
      ds: [On(n / 10, 'pv_tenths_hundredths'), O(`${n}.100`, 'fd' + n, 'dec_frac_digits'), On(n / 1000, 'pv_tenths_hundredths')],
      fill: () => null,
      sol: `${fr(n, 100)} means ${n} hundredths, which is ${num(n / 100)}.`,
      steps: [
        `${fr(n, 100)} means ${n} hundredths.`,
        'Hundredths is the second place after the decimal point.',
        n < 10 ? `${n} hundredths has only one digit, so put a 0 in the tenths place: ${num(n / 100)}.` : `Write ${n} so it ends in the hundredths place: ${num(n / 100)}.`,
      ],
    });
  }
  const d = R.pick([2, 4, 5]); let n; do { n = R.int(1, d - 1); } while (gcd(n, d) !== 1);
  const inv = d / n, term = isInt(inv * 1000), k = 100 / d;
  return makeItem({
    prompt: `Which decimal is equal to ${fr(n, d)}?`, correct: On(n / d),
    ds: [On(Number(`0.${n}${d}`), 'dec_frac_digits'), On(n / 10, 'dec_numerator_tenths'), term ? On(inv, 'div_order_reversed') : null],
    fill: () => { const x = round6(n / d + R.pick([0.1, -0.05, 0.05, 0.15])); return x > 0 ? On(x) : null; },
    sol: `Make the bottom 10 or 100: ${fr(n, d)} = ${fr(n * 100 / d, 100)} = ${num(n / d)}.`,
    steps: [
      `Make the bottom 100: ${d} ${TIMES} ${k} = 100.`,
      `Multiply the top by ${k} too: ${n} ${TIMES} ${k} = ${n * k}. So ${fr(n, d)} = ${fr(n * k, 100)}.`,
      `${n * k} hundredths = ${(n * k / 100).toFixed(2) === num(n / d) ? num(n / d) : `${(n * k / 100).toFixed(2)} = ${num(n / d)}`}.`,
      `(Another way: a fraction bar means divide, and ${n} ${DIVIDE} ${d} = ${num(n / d)}.)`,
    ],
  });
};

G.decaddsub = () => {
  if (R.chance(0.55)) {
    let aw, ad, bw, bd; do { aw = R.int(10, 49); ad = R.int(1, 9); bw = R.int(1, 9); bd = R.int(11, 89); } while (bd % 10 === 0 || ad + bd >= 100);
    const a = aw + ad / 10, b = bw + bd / 100, c = round6(a + b), A = aw * 100 + ad * 10, Bn = bw * 100 + bd;
    return makeItem({
      prompt: `${num(a)} + ${num(b)} = ?`, correct: On(c),
      ds: [On((aw * 10 + ad + bw * 100 + bd) / 100, 'dec_align_right'), On(aw + bw + (ad + bd) / 100, 'dec_parts_separate'), On(c + 1)],
      fill: nearFill(c, [0.1, -0.1, 1, -1, 0.01]),
      sol: `Line up the decimal points (write ${num(a)} as ${aw}.${ad}0): ${aw}.${ad}0 + ${num(b)} = ${num(c)}.`,
      work: colWork([{ s: `${aw}.${ad}0` }, { op: '+', s: b.toFixed(2) }], c.toFixed(2)),
      steps: [
        `Line up the decimal points, not the last digits. Write ${num(a)} as ${aw}.${ad}0 so both numbers have two digits after the point.`,
        `Add as if the decimal points weren’t there: ${A} + ${Bn} = ${A + Bn}.`,
        `Put the decimal point back in the same column: ${c.toFixed(2)}.`,
        `Check by estimating: about ${Math.round(a)} + ${Math.round(b)} = ${Math.round(a) + Math.round(b)}.`,
      ],
    });
  }
  let a, bw, bd; do { a = R.int(6, 20); bw = R.int(1, a - 2); bd = R.int(11, 89); } while (bd % 10 === 0);
  const b = bw + bd / 100, c = round6(a - b);
  return makeItem({
    prompt: `${a} ${MINUS} ${num(b)} = ?`, correct: On(c),
    ds: [On(a - bw + bd / 100, 'dec_sub_bring_down'), On(c + 1), On(c - 0.1)],
    fill: nearFill(c, [0.1, -1, 0.01, 1.1]),
    sol: `Write ${a} as ${a}.00, then subtract: ${a}.00 ${MINUS} ${num(b)} = ${num(c)}.`,
    work: colWork([{ s: `${a}.00` }, { op: MINUS, s: b.toFixed(2) }], c.toFixed(2)),
    steps: [
      `A whole number has a decimal point at the end: write ${a} as ${a}.00 so both numbers have two digits after the point.`,
      `You can’t just bring down the .${String(bd).padStart(2, '0')}. Subtract it from the zeros by regrouping, like whole numbers: ${a * 100} ${MINUS} ${bw * 100 + bd} = ${Math.round(c * 100)}.`,
      `Put the decimal point back in the same column: ${c.toFixed(2)}.`,
      `Check by adding back: ${c.toFixed(2)} + ${b.toFixed(2)} = ${a}.00.`,
    ],
  });
};

function decPlaces(x) { const s = String(round6(x)); return s.includes('.') ? s.split('.')[1].length : 0; }
G.decmult = () => {
  const t = R.int(1, 3); let a, b;
  do {
    if (t === 1) { a = R.int(11, 49) / 10; b = R.int(2, 9) / 10; }
    else if (t === 2) { a = R.int(2, 9); b = R.int(11, 95) / 100; }
    else { a = R.int(11, 39) / 10; b = R.int(2, 9); }
  } while (decPlaces(a) + decPlaces(b) < (t === 2 ? 2 : 1) || (t === 2 && decPlaces(b) < 2));
  const c = round6(a * b), pa = decPlaces(a), pb = decPlaces(b), A = round6(a * Math.pow(10, pa)), B = round6(b * Math.pow(10, pb));
  const check = t === 3 ? `Check by estimating: about ${Math.round(a)} ${TIMES} ${b} = ${Math.round(a) * b}, which is close to ${num(c)}.`
    : `Check: ${num(b)} is less than 1, so the answer must be less than ${num(a)}.`;
  return makeItem({
    prompt: `${num(a)} ${TIMES} ${num(b)} = ?`, correct: On(c),
    ds: [On(c * 10, 'dec_mult_places'), On(c / 10, 'dec_mult_places'), On(c + (t === 2 ? 0.1 : 1))],
    fill: nearFill(c, [0.2, -0.1, 2], null, 0.001),
    sol: `${A} ${TIMES} ${B} = ${num(A * B)}. The factors have ${pa + pb} decimal place${pa + pb > 1 ? 's' : ''} in all, so the answer is ${num(c)}.`,
    steps: [
      `Multiply as if the decimal points weren’t there: ${A} ${TIMES} ${B} = ${num(A * B)}.`,
      `Count the digits after the decimal points: ${num(a)} has ${pa} and ${num(b)} has ${pb}, so ${pa + pb} in all.`,
      `Start at the end of ${num(A * B)} and move the decimal point ${pa + pb} ${nth(pa + pb, 'place', 'places')} to the left: ${num(c)}.`,
      check,
    ],
  });
};

G.decdiv = () => {
  if (R.chance(0.5)) {
    let q; do { q = R.int(11, 49) / 10; } while (isInt(q));
    const w = R.int(2, 9), n = round6(q * w), N = Math.round(n * 10), Q = Math.round(q * 10), L = longDiv(N, w);
    return makeItem({
      prompt: `${num(n)} ${DIVIDE} ${w} = ?`, correct: On(q),
      ds: [On(q * 10, 'dec_div_places'), On(q / 10, 'dec_div_places'), On(q + 1)],
      fill: nearFill(q, [0.1, -0.1, 0.2]),
      sol: `${num(n)} ${DIVIDE} ${w} = ${num(q)}. Check: ${num(q)} ${TIMES} ${w} = ${num(n)}.`,
      work: L.work,
      steps: [`Think of ${num(n)} as ${N} tenths, and divide the tenths by ${w}.`, ...L.steps, `${Q} tenths = ${num(q)}. The decimal point goes straight up into the answer.`, `Check: ${num(q)} ${TIMES} ${w} = ${num(n)}.`],
    });
  }
  const dv = R.int(2, 9) / 10, q = R.int(3, 30), n = round6(q * dv), N = Math.round(n * 10), D = Math.round(dv * 10), L = longDiv(N, D);
  return makeItem({
    prompt: `${num(n)} ${DIVIDE} ${num(dv)} = ?`, correct: On(q),
    ds: [On(q / 10, 'dec_div_places'), On(q * 10, 'dec_div_places'), On(q + 1)],
    fill: nearFill(q, [2, -1, -2]),
    sol: `Move both decimal points one place right: ${num(n * 10)} ${DIVIDE} ${num(dv * 10)} = ${q}.`,
    work: L.work,
    steps: [
      `Make the number you divide by a whole number: multiply both numbers by 10 (move both decimal points one place right).`,
      `${num(n)} ${DIVIDE} ${num(dv)} becomes ${N} ${DIVIDE} ${D}. Same answer, easier problem.`,
      ...L.steps,
      `Check: ${q} ${TIMES} ${num(dv)} = ${num(n)}. Dividing by a number less than 1 gives a bigger answer.`,
    ],
  });

// ===== Section D: Ratios, rates & percents =====
const RCTX = [
  { a: 'girls', b: 'boys', all: 'students', s: (x, y) => `In a class, there are ${x} girls and ${y} boys.` },
  { a: 'red marbles', b: 'blue marbles', all: 'marbles', s: (x, y) => `A bag has ${x} red marbles and ${y} blue marbles.` },
  { a: 'dogs', b: 'cats', all: 'animals', s: (x, y) => `A shelter has ${x} dogs and ${y} cats.` },
  { a: 'apples', b: 'oranges', all: 'pieces of fruit', s: (x, y) => `A basket holds ${x} apples and ${y} oranges.` },
  { a: 'wins', b: 'losses', all: 'games', s: (x, y) => `A team had ${x} wins and ${y} losses, and no ties.` },
];
G.ratiomeaning = () => {
  const c = R.pick(RCTX); let x, y; do { x = R.int(3, 15); y = R.int(3, 15); } while (x === y);
  const T = x + y, rt = (p, q, m) => O(`${p} : ${q}`, `${p}:${q}`, m);
  if (R.chance(0.5)) return makeItem({
    prompt: `${c.s(x, y)} What is the ratio of ${c.a} to ${c.b}?`, correct: rt(x, y),
    ds: [rt(y, x, 'ratio_order'), rt(x, T, 'ratio_part_whole'), rt(y, T, 'ratio_part_whole')],
    sol: `${cap(c.a)} to ${c.b}, in that order: ${x} : ${y}.`,
    steps: [`A ratio follows the order of the words. “${cap(c.a)} to ${c.b}” means ${c.a} first, ${c.b} second.`, `${cap(c.a)}: ${x}. ${cap(c.b)}: ${y}.`, `So the ratio is ${x} : ${y}. (${y} : ${x} would be ${c.b} to ${c.a}.)`],
  });
  return makeItem({
    prompt: `${c.s(x, y)} What is the ratio of ${c.a} to all the ${c.all}?`, correct: rt(x, T),
    ds: [rt(x, y, 'ratio_part_whole'), rt(T, x, 'ratio_order'), rt(y, T, 'ratio_order')],
    sol: `There are ${x} + ${y} = ${T} ${c.all} in all, so the ratio is ${x} : ${T}.`,
    steps: [`“All the ${c.all}” means the total, so add first: ${x} + ${y} = ${T}.`, `${cap(c.a)} come first, then the total.`, `So the ratio is ${x} : ${T}.`],
  });
};

G.equivratio = () => {
  if (R.chance(0.6)) {
    let a, b; do { a = R.int(2, 9); b = R.int(2, 9); } while (a === b);
    const k = R.int(2, 6), c = b * k, ans = a * k;
    const ctx = R.pick([
      [`A recipe uses ${a} cups of flour for every ${b} cups of sugar. How many cups of flour go with ${c} cups of sugar?`, 'Flour', 'Sugar'],
      [`To make green paint, Leo mixes ${a} cans of blue for every ${b} cans of yellow. How many cans of blue does he need for ${c} cans of yellow?`, 'Blue', 'Yellow'],
      [`A field trip has ${a} students for every ${b} adults. How many students are there if ${c} adults go?`, 'Students', 'Adults'],
    ]);
    return makeItem({
      prompt: ctx[0], correct: On(ans), ds: [On(a + c - b, 'ratio_additive'), On(a * c, 'ratio_scale_wrong'), On(ans + a)], fill: nearFill(ans, [-a, 2 * a, 1]),
      sol: `${c} is ${k} times ${b}, so multiply ${a} by ${k} too: ${a} ${TIMES} ${k} = ${ans}.`,
      work: `<div class="work-wrap">${tableH([[ctx[1], a, ans], [ctx[2], b, c]])}</div>`,
      steps: [
        `Make a ratio table: ${a} ${ctx[1].toLowerCase()} go with ${b} ${ctx[2].toLowerCase()}.`,
        `How did ${b} become ${c}? ${b} ${TIMES} ${k} = ${c}.`,
        `Do the same to the other number: ${a} ${TIMES} ${k} = ${ans}.`,
        `Adding ${c - b} to both numbers would not work: a ratio stays the same only when you multiply both numbers by the same number.`,
      ],
    });
  }
  let a, b; do { a = R.int(2, 7); b = R.int(2, 9); } while (a === b);
  const k1 = R.int(2, 4), k2 = R.int(k1 + 1, 7), ans = b * k2;
  const [xl, yl] = R.pick([['Cups of water', 'Scoops of mix'], ['Laps run', 'Minutes'], ['Tickets', 'Dollars'], ['Boxes', 'Crayons']]);
  return makeItem({
    prompt: 'The table shows equivalent ratios. What number goes in the empty box?',
    fig: tableH([[xl, a, a * k1, a * k2], [yl, b, b * k1, '?']]),
    correct: On(ans), ds: [On(b * k1 + a * (k2 - k1), 'ratio_additive'), On(ans + b), On(ans - b)], fill: nearFill(ans, [1, -1, 2 * b]),
    sol: `${a * k2} is ${k2} times ${a}, so multiply ${b} by ${k2}: ${ans}.`,
    steps: [
      `Compare the last column with the first: ${a} ${TIMES} ${k2} = ${a * k2}.`,
      `Multiply the bottom number by the same amount: ${b} ${TIMES} ${k2} = ${ans}.`,
      `Check with the middle column: ${a} ${TIMES} ${k1} = ${a * k1} and ${b} ${TIMES} ${k1} = ${b * k1}. Same pattern.`,
    ],
  });
};

// How to find p% of N the way it's taught: 10%, halves and quarters.
function percentSteps(p, N) {
  const c = p * N / 100, ten = N / 10;
  if (p === 50) return [`50% is half. Half of ${N} is ${N} ${DIVIDE} 2 = ${num(c)}.`];
  if (p === 25) return [`25% is one quarter. ${N} ${DIVIDE} 4 = ${num(c)}.`];
  if (p === 75) return [`75% is three quarters. One quarter: ${N} ${DIVIDE} 4 = ${num(N / 4)}.`, `Three quarters: ${num(N / 4)} ${TIMES} 3 = ${num(c)}.`];
  if (p === 10) return [`10% means divide by 10: ${N} ${DIVIDE} 10 = ${num(c)}.`];
  if (p === 5) return [`First find 10%: ${N} ${DIVIDE} 10 = ${num(ten)}.`, `5% is half of 10%: ${num(ten)} ${DIVIDE} 2 = ${num(c)}.`];
  if (p === 15) return [`First find 10%: ${N} ${DIVIDE} 10 = ${num(ten)}.`, `5% is half of that: ${num(ten / 2)}.`, `15% = 10% + 5% = ${num(ten)} + ${num(ten / 2)} = ${num(c)}.`];
  return [`First find 10%: ${N} ${DIVIDE} 10 = ${num(ten)}.`, `${p}% is ${p / 10} groups of 10%: ${p / 10} ${TIMES} ${num(ten)} = ${num(c)}.`];
}
const PCT = [[10, 10], [20, 5], [25, 4], [30, 10], [40, 5], [50, 2], [60, 5], [75, 4], [5, 20], [15, 20]];
G.percentof = () => {
  const [p, m] = R.pick(PCT); let N; do { N = m * R.int(2, 20); } while (N < 20 || N > 200);
  const c = p * N / 100;
  if (R.chance(0.6)) return makeItem({
    prompt: `What is ${p}% of ${N}?`, correct: On(c),
    ds: [N - p > 0 ? On(N - p, 'pct_subtract') : null, On(c >= 10 ? c / 10 : c * 10, 'pct_decimal'), isInt(N / p) ? On(N / p, 'pct_divide') : null, On(c + N / 10)],
    fill: nearFill(c, [N / 10, -N / 10, 5, -5, 1]),
    sol: `${p}% means ${p} out of 100. ${p}% of ${N} = ${fr(p, 100)} ${TIMES} ${N} = ${num(c)}.`,
    steps: [`${p}% means ${p} out of every 100.`, ...percentSteps(p, N)],
  });
  const item = R.pick(['jacket', 'video game', 'pair of shoes', 'backpack']);
  return makeItem({
    prompt: `A ${item} costs $${N}. It is on sale for ${p}% off. How much money is the <b>discount</b>?`, correct: O(dollars(c), kn(c)),
    ds: [O(dollars(N - c), kn(N - c), 'pct_sale_price'), N - p > 0 ? O(dollars(N - p), kn(N - p), 'pct_subtract') : null, O(dollars(c >= 10 ? c / 10 : c * 10), kn(c >= 10 ? c / 10 : c * 10), 'pct_decimal')],
    fill: () => { const x = round6(c + R.pick([5, -5, 1, 2])); return x > 0 ? O(dollars(x), kn(x)) : null; },
    sol: `${p}% of $${N} = ${dollars(c)}. (The sale price would be ${dollars(N - c)}.)`,
    steps: [`The discount is the amount taken off: ${p}% of $${N}.`, ...percentSteps(p, N), `So the discount is ${dollars(c)}. (The sale price would be $${N} ${MINUS} ${dollars(c)} = ${dollars(N - c)}, but the question asks for the discount.)`],
  });
};

G.percentfind = () => {
  if (R.chance(0.5)) {
    const p = R.pick([10, 20, 25, 40, 60, 75, 80]), whole = R.pick([20, 40, 60, 80, 120, 200].filter(N => (N * p) % 100 === 0)), part = whole * p / 100;
    const P = (x, m) => O(num(x) + '%', 'p' + kn(x), m), nm = R.pick(NAMES);
    const prompt = R.chance(0.5) ? `A test has ${whole} questions. ${nm} got ${part} of them right. What percent did ${nm} get right?` : `In a club of ${whole} students, ${part} are in 6th grade. What percent of the club is in 6th grade?`;
    return makeItem({
      prompt, correct: P(p),
      ds: [P(part, 'pct_part_is_percent'), P(100 - p, 'pct_complement'), isInt(whole / part) ? P(whole / part, 'pct_whole_over_part') : null],
      fill: () => { const x = p + R.pick([5, -5, 10, -10, 15]); return x > 0 && x < 100 ? P(x) : null; },
      sol: `${part} ${DIVIDE} ${whole} = ${num(part / whole)}, which is ${p}%.`,
      steps: [
        `Write it as a fraction: part over whole = ${fr(part, whole)}.`,
        `Divide: ${part} ${DIVIDE} ${whole} = ${num(part / whole)}.`,
        `Percent means out of 100, so multiply by 100: ${num(part / whole)} ${TIMES} 100 = ${p}%.`,
        `(${part} is the number of ${prompt.includes('test') ? 'questions' : 'students'}, not the percent.)`,
      ],
    });
  }
  const p = R.pick([10, 20, 25, 30, 40, 50, 60, 75]); let whole; do { whole = R.int(2, 20) * R.pick([4, 5, 10]); } while ((whole * p) % 100 !== 0 || whole < 20 || whole > 200);
  const part = whole * p / 100;
  const prompt = R.pick([`${part} is ${p}% of what number?`, `A store sold ${part} T-shirts on Monday. That was ${p}% of all its T-shirts. How many T-shirts did the store have?`, `${part} students walk to school. That is ${p}% of all the students in the grade. How many students are in the grade?`]);
  const how = 100 % p === 0
    ? [`${p}% is ${fr(1, 100 / p)} of the total.`, `So the total is ${100 / p} times as big: ${part} ${TIMES} ${100 / p} = ${whole}.`]
    : p % 10 === 0
      ? [`${p}% is ${p / 10} groups of 10%. So 10% is ${part} ${DIVIDE} ${p / 10} = ${num(part / (p / 10))}.`, `The total is 100%, which is 10 groups of 10%: ${num(part / (p / 10))} ${TIMES} 10 = ${whole}.`]
      : [`75% is three quarters. So one quarter (25%) is ${part} ${DIVIDE} 3 = ${num(part / 3)}.`, `The total is four quarters: ${num(part / 3)} ${TIMES} 4 = ${whole}.`];
  return makeItem({
    prompt, correct: On(whole),
    ds: [On(part * p / 100, 'pct_find_whole_wrong'), On(part / p, 'pct_no_100'), On(part + p, 'pct_add')],
    fill: nearFill(whole, [10, -10, 20, part]),
    sol: `If ${p}% is ${part}, then 1% is ${num(part / p)}, and 100% is ${num(part / p)} ${TIMES} 100 = ${whole}.`,
    steps: [`${part} is only part of the total. The total is 100%, so the answer must be bigger than ${part}.`, ...how, `Check: ${p}% of ${whole} = ${part}.`],
  });
};

  const a = R.int(1, 6), b = R.int(2, 6), ans = (a + b) * (a + b);
  return makeItem({
    prompt: `(${a} + ${b})<sup>2</sup> = ?`, correct: On(ans),
    ds: [On(a * a + b * b, 'exp_distribute'), On(2 * (a + b), 'exp_times'), On(a + b * b, 'oop_ignore_parens')],
    fill: nearFill(ans, [a + b, -(a + b), 1]),
    sol: `Parentheses first: ${a} + ${b} = ${a + b}. Then ${a + b}<sup>2</sup> = ${a + b} ${TIMES} ${a + b} = ${ans}.`,
      steps: [`Parentheses first: ${a} + ${b} = ${a + b}.`, `Then square it: ${a + b}<sup>2</sup> = ${a + b} ${TIMES} ${a + b} = ${ans}.`, `(Squaring ${a} and ${b} separately gives ${a * a} + ${b * b} = ${a * a + b * b}, which is not the same.)`],
  });
};

G.writeexpr = () => {
  const X = V(R.pick(['n', 'x', 'm', 'y', 'k'])), t = R.int(1, 6);
  let a, b;
  if (t === 1) {
    a = R.int(3, 12);
    return makeItem({ prompt: `Which expression means \u201c${a} less than a number ${X}\u201d?`, correct: S(`${X} ${MINUS} ${a}`),
      ds: [SM(`${a} ${MINUS} ${X}`, 'expr_less_than'), SM(`${a} &lt; ${X}`, 'expr_less_symbol'), SM(`${X} + ${a}`, 'wrong_operation')],
      sol: `\u201c${a} less than ${X}\u201d means start with ${X} and take away ${a}: ${X} ${MINUS} ${a}.`,
      steps: [`\u201cLess than\u201d flips the order. \u201c${a} less than ${X}\u201d means start with ${X} and make it ${a} smaller.`, `Example: 3 less than 10 is 10 ${MINUS} 3 = 7, so the number you start with comes first.`, `So the expression is ${X} ${MINUS} ${a}. (The &lt; symbol means something else: \u201cis less than.\u201d)`] });
